<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — UI 시안</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 640px; width: 100%; margin: 40px auto; padding: 0 16px; color: #222; }
  img { max-width: 100%; height: auto; }
  .badge { display: inline-block; background: #eef2ff; color: #4338ca; padding: 4px 10px; border-radius: 999px; font-size: 12px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .hero { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border-radius: 12px; padding: 32px 24px; margin-bottom: 24px; }
  .hero p { margin: 8px 0 0; opacity: .9; }
  .section { border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin: 0 0 12px; }
  ul { margin: 0; padding-left: 20px; }
  li { margin: 6px 0; overflow-wrap: break-word; }
  .quote-amount { font-size: 28px; font-weight: 700; color: #4338ca; }
  .quote-basis { color: #6b7280; margin-top: 6px; font-size: 14px; }
  .footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 32px; overflow-wrap: break-word; }
  @media (max-width: 768px) {
    body { margin: 24px auto; }
    .hero { padding: 28px 20px; }
  }
  @media (max-width: 480px) {
    body { margin: 16px auto; padding: 0 12px; }
    h1 { font-size: 20px; }
    .hero { padding: 24px 16px; margin-bottom: 16px; }
    .hero p { font-size: 0.9375rem; }
    .section { padding: 16px; }
    .quote-amount { font-size: 22px; }
    .quote-basis { font-size: 0.8125rem; }
  }
</style>
</head>
<body>
  <div class="badge">시안 변형 v1 · {{PLATFORM}}</div>
  <div class="hero">
    <h1>{{TITLE}}</h1>
    <p>요청하신 내용을 바탕으로 만든 시안입니다.</p>
  </div>

  <div class="section">
    <h2>핵심 기능</h2>
    <ul>
{{FEATURES_HTML}}
    </ul>
  </div>

  <div class="section">
    <h2>견적</h2>
    <div class="quote-amount">{{QUOTE_AMOUNT}}</div>
    <div class="quote-basis">{{QUOTE_BASIS}}</div>
  </div>

  <div class="footer">requirement_id: {{REQUIREMENT_ID}}</div>
</body>
</html>
