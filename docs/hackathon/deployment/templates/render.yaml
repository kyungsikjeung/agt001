# Render Blueprint (IaC) — 대시보드 수동 설정을 대체하고 싶을 때 사용
# 사용법: 레포 루트에 이 파일을 두고 Render 대시보드에서 "New Blueprint Instance"로 연결
# 참고: docs/deployment/RENDER_DEPLOY.md §3-3

services:
  - type: web
    name: agt001-backend
    env: docker
    dockerfilePath: ./docs/deployment/templates/Dockerfile.backend
    region: singapore
    plan: free # 심사 직전 'starter'로 수동 전환 권장
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NIM_API_KEY
        sync: false # 대시보드에서 직접 입력 (레포에 값 커밋 금지)
      - key: NIM_CHAT_MODEL
        value: nemotron-3-super-120b
      - key: NIM_EMBED_MODEL
        value: nemotron-3-embed-1b
      - key: VECTOR_DB_URL
        sync: false
      - key: VECTOR_DB_API_KEY
        sync: false
      - key: KAKAO_LINK_API_KEY
        sync: false
