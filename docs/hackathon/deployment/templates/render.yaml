# Render Blueprint (IaC) — 대시보드 수동 설정을 대체하고 싶을 때 사용
# 사용법: 레포 루트에 이 파일을 두고 Render 대시보드에서 "New Blueprint Instance"로 연결
# 참고: docs/hackathon/deployment/RENDER_DEPLOY.md §3-3, §3-8(백그라운드 워커)

services:
  # 병렬작업 1 담당: 챗봇/게이트웨이/RAG/견적 — 웹 요청에 응답하는 서비스
  - type: web
    name: agt001-backend
    env: docker
    dockerfilePath: ./docs/hackathon/deployment/templates/Dockerfile.backend
    region: singapore
    plan: free # 심사 직전 'starter'로 수동 전환 권장
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NIM_API_KEY
        sync: false # 대시보드에서 직접 입력 (레포에 값 커밋 금지)
      - key: NIM_CHAT_MODEL
        value: nemotron-3-super-120b
      - key: NIM_EMBED_MODEL
        value: nemotron-3-embed-1b
      - key: VECTOR_DB_URL
        sync: false
      - key: VECTOR_DB_API_KEY
        sync: false
      - key: KAKAO_LINK_API_KEY
        sync: false

  # 병렬작업 3 담당: 코드 생성·빌드 — 실행 시간이 긴 작업을 웹 요청과 분리
  # (ARCHITECTURE.md §6-2 권장안 A, PARALLEL_3_SPEC.md §5 참고. Web Service와 별도 과금됨 — 무료 플랜 2개 동시 사용 가능하나 콜드스타트도 개별 발생)
  - type: worker
    name: agt001-build-worker
    env: docker
    dockerfilePath: ./docs/hackathon/deployment/templates/Dockerfile.backend
    dockerCommand: python worker.py # 병렬작업 3가 작성할 워커 진입점 (backend.py와 별도)
    region: singapore
    plan: free
    envVars:
      - key: NIM_API_KEY
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false # 워커가 빌드 완료 후 자체 배포를 트리거할 때 사용 (선택)
