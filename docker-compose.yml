# 병렬작업 1·2·3 공통 개발환경 (REQ-ENV-001)
# 사용법: cp .env.example .env 로 값 채운 뒤 `docker compose up --build`
# 배포용 Dockerfile은 docs/hackathon/deployment/templates/Dockerfile.backend 를 재사용한다.
# 병렬작업 2(정적 시안 페이지)·병렬작업 3(웹/워커)가 각자 서비스를 이 파일에 추가해 나간다 — 지금은 backend 서비스(병렬작업 1 담당 챗봇/게이트웨이) 골격만 있다.

# 프로젝트 이름을 고정한다. 기본값은 디렉터리 이름이라, 서버 경로가 바뀌면 볼륨 이름
# (agt001_pg_data, agt001_caddy_data)이 달라져 DB와 인증서가 빈 볼륨으로 바뀐다.
name: agt001

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agt001
      - POSTGRES_DB=agt001
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      # 모든 시간은 한국 시간 기준(사용자 결정 2026-09-27). 저장은 timestamptz라 값은 그대로, 보이는 시간대만 바뀐다.
      - TZ=Asia/Seoul
      - PGTZ=Asia/Seoul
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - timezone=Asia/Seoul
      - -c
      - log_timezone=Asia/Seoul
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=30
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agt001 -d agt001"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docs/hackathon/deployment/templates/Dockerfile.backend
    env_file:
      - .env
    environment:
      # 병렬작업 3 코드생성 격리(docker run -v)가 host docker.sock을 통해 호스트 데몬에 명령을
      # 보내므로, 마운트 소스는 컨테이너 내부(/app) 경로가 아니라 이 호스트 실제 경로여야
      # 한다. compose가 실행되는 디렉토리(=이 파일이 있는 프로젝트 루트)를 그대로 넘긴다.
      - HOST_PROJECT_DIR=${PWD}
      # 모든 시간은 한국 시간 기준(사용자 결정 2026-09-27): "오늘"·로그·타이머가 새벽 0~9시에 하루 어긋나지 않게.
      - TZ=Asia/Seoul
      # 생성 사이트·시안 전용 주소(S-1, deploy/Caddyfile 두 번째 블록). 비우면 앱 주소에서 함께 연다.
      - PREVIEW_HOST=${PREVIEW_HOST-144-24-91-250.sslip.io}
      - DATABASE_URL=postgresql+psycopg://agt001:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}@db:5432/agt001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8643:8643"
    volumes:
      - .:/app
      # 병렬작업 3(코드생성) 격리용 Docker-outside-of-Docker: 컨테이너 안에서 `docker run`으로
      # 별도 샌드박스 컨테이너(docker/hermes-sandbox)를 띄우려면 호스트 데몬 소켓이 필요하다.
      # 주의: 이 소켓에 접근 가능한 프로세스는 사실상 호스트에 대한 루트급 권한과 동급이다 —
      # backend 컨테이너 자체가 신뢰된 코드(우리 자신의 백엔드)만 실행한다는 전제에서만 안전하다.
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 파일 하나가 아니라 폴더를 붙인다: git checkout이 파일을 새로 만들면 파일 바인드는 옛 파일을 계속 본다.
      - ./deploy:/etc/caddy:ro
      # 주의: 이 볼륨에 HTTPS 인증서가 있다. 지우지 말 것(docker compose down -v 금지).
      # sslip.io는 Let's Encrypt 발급 한도를 전 세계가 나눠 써서 재발급이 막힐 수 있다(RESEARCH_INFRA_COST §2).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:
