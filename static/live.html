<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>실시간 대화로 만들기</title>
<meta name="robots" content="noindex" />
<link rel="manifest" href="/manifest.json" />
<style>
  /* 채팅방(room.html)과 같은 색 토큰 */
  :root {
    --accent: #6366f1;
    --accent-dark: #4338ca;
    --accent-soft: #eef2ff;
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #1f2328;
    --text-muted: #52525b;
    --live: #dc2626;
    --live-soft: #fef2f2;
    --stage: #e9e9ee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.0625rem; margin: 0; font-weight: 700; flex: 1; min-width: 0; }
  header a {
    font-size: 0.8125rem; color: var(--accent-dark); font-weight: 600; text-decoration: none;
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; white-space: nowrap;
  }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 420px) 1fr; }

  /* ── 대화 ── */
  .talk { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border-right: 1px solid var(--border); }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; line-height: 1.5; font-size: 0.9375rem; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .msg.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-top-right-radius: 4px; }
  .msg .ack { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips button {
    border: 1px solid var(--accent); color: var(--accent-dark); background: var(--surface);
    border-radius: 999px; padding: 6px 12px; font-size: 0.875rem;
  }
  .chips button:hover { background: var(--accent-soft); }
  .chips button:disabled { opacity: 0.45; cursor: default; }

  #status {
    display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 16px;
    font-size: 0.8125rem; color: var(--text-muted); border-top: 1px solid var(--border);
  }
  #status .meter { width: 48px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; display: none; }
  #status .meter i { display: block; height: 100%; width: 0; background: var(--live); transition: width 80ms linear; }
  #status.listening .meter { display: block; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: none; }
  #status.listening .dot { background: var(--live); animation: pulse 1s ease-in-out infinite; }
  #status.speaking .dot, #status.busy .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .composer { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .composer input {
    flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 1rem;
  }
  .composer .send { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 14px; font-weight: 600; }
  .voice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 10px; }
  .voice-row button {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 12px; padding: 12px 10px; font-weight: 700; font-size: 0.9375rem;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  #micBtn[aria-pressed="true"] { border-color: var(--live); color: var(--live); background: var(--live-soft); }
  #liveBtn { background: var(--live); border-color: var(--live); color: #fff; }
  #liveBtn[aria-pressed="true"] { background: var(--surface); color: var(--live); }

  /* ── 미리보기 ── */
  .stage { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--stage); }
  .stage-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; }
  .stage-bar strong { font-size: 0.9375rem; margin-right: auto; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 0.8125rem; color: var(--text-muted); font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #parts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; min-height: 8px; }
  #parts span { font-size: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; color: var(--text-muted); }
  #parts span.new { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); font-weight: 700; }
  #frames { flex: 1; min-height: 0; min-width: 0; overflow: auto; display: flex; gap: 20px; justify-content: center; align-items: flex-start; padding: 8px 16px 24px; }
  .device { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .device .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
  .device .clip { overflow: hidden; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
  .device.mobile .clip { border-radius: 28px; border: 8px solid #1f2328; }
  .device.pc .clip { border-radius: 10px; border: 1px solid #c9c9d1; }
  .device iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
  .empty { margin: auto; text-align: center; color: var(--text-muted); font-size: 0.9375rem; line-height: 1.6; padding: 24px; }
  .empty b { display: block; font-size: 1.125rem; color: var(--text); margin-bottom: 4px; }

  /* 휴대폰: 미리보기 위, 대화 아래 */
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 46vh) 1fr; }
    .stage { order: -1; border-bottom: 1px solid var(--border); }
    .talk { border-right: 0; }
    .stage-bar { padding: 8px 12px; }
    #frames { padding: 4px 12px 12px; gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #status .dot { animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>🎙️ 실시간 대화로 만들기</h1>
  <a id="roomLink" href="/room.html">채팅방으로</a>
</header>
<main>
  <section class="talk" aria-label="대화">
    <div id="log" aria-live="polite"></div>
    <div id="status" role="status"><span class="dot"></span><span class="meter"><i></i></span><span id="statusText">준비됐어요</span></div>
    <div class="voice-row">
      <button id="micBtn" type="button" aria-pressed="false" title="말하면 글자로 바꿔 입력칸에 넣어요">🎤 음성</button>
      <button id="liveBtn" type="button" aria-pressed="false" title="질문을 읽어 주고, 말이 끝나면 알아서 보내요">🔴 실시간 대화</button>
    </div>
    <form class="composer" id="composer">
      <input id="input" type="text" maxlength="500" autocomplete="off" placeholder="말하거나 적어 주세요" aria-label="답 입력" />
      <button class="send" type="submit">보내기</button>
    </form>
  </section>
  <section class="stage" aria-label="실시간 미리보기">
    <div class="stage-bar">
      <strong>실시간 미리보기</strong>
      <div class="seg" role="group" aria-label="미리보기 기기">
        <button type="button" data-view="mobile" aria-pressed="false">모바일</button>
        <button type="button" data-view="pc" aria-pressed="false">PC</button>
        <button type="button" data-view="both" aria-pressed="false">둘 다</button>
      </div>
    </div>
    <div id="parts" aria-label="정한 부품"></div>
    <div id="frames"></div>
  </section>
</main>
<script src="/live.js" defer></script>
</body>
</html>
