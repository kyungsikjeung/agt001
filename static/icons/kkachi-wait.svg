<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="기다리는 까치">
  <!-- 기다리는 까치(불러오는 중·만드는 중). 기본: 한마디 까치 (대표 고름 10/2: 정면 마스코트). 반가운 소식을 물어다 주는 새가 '한마디'를 전한다.
       펭귄과 헷갈리지 않게 까치 표시: 검은 머리·가슴에 흰 배는 아래쪽만, 몸에 붙은 청록 날개와 흰 어깨 무늬,
       몸 뒤로 솟은 긴 청록 꼬리. 어두운 바탕에서 보이게 밝은 테두리. -->
  <!-- 꼬리: 몸 뒤에서 오른쪽 위로, 끝으로 갈수록 넓게 -->
  <path d="M54 72 L78 30 Q84 22 91 28 Q94 34 90 40 L64 78 Z" fill="#2E5B6E" stroke="#5E93A8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 72 L85 31" stroke="#5E93A8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 머리+몸: 바깥선만 남게 선을 먼저 그리고 같은 모양으로 덮는다 -->
  <g stroke="#ECEBE6" stroke-width="3">
    <circle cx="44" cy="33" r="18"/>
    <ellipse cx="44" cy="60" rx="23" ry="24"/>
  </g>
  <g fill="#1E2830">
    <circle cx="44" cy="33" r="18"/>
    <ellipse cx="44" cy="60" rx="23" ry="24"/>
  </g>
  <!-- 흰 배: 아래쪽만 -->
  <path d="M30 68 Q44 60 58 68 Q58 80 44 83 Q30 80 30 68 Z" fill="#ECEBE6"/>
  <!-- 날개: 몸 옆에 붙은 청록, 위에 흰 어깨 무늬 -->
  <path d="M22.5 52 Q20 66 27 78 Q33 70 32 56 Q28 51 22.5 52 Z" fill="#2E5B6E"/>
  <path d="M65.5 52 Q68 66 61 78 Q55 70 56 56 Q60 51 65.5 52 Z" fill="#2E5B6E"/>
  <path d="M22.6 52.2 Q22 57 22.4 60 Q28 58 31.6 55.5 Q28 51 22.6 52.2 Z" fill="#ECEBE6"/>
  <path d="M65.4 52.2 Q66 57 65.6 60 Q60 58 56.4 55.5 Q60 51 65.4 52.2 Z" fill="#ECEBE6"/>
  <!-- 눈·부리 -->
  <path d="M34.5 32 Q37.5 28.5 40.5 32 M47.5 32 Q50.5 28.5 53.5 32" stroke="#ECEBE6" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M40 37 H48 L44 43.5 Z" fill="#C9A35A"/>
  <!-- 발 -->
  <path d="M38 84 v5 M50 84 v5" stroke="#C9A35A" stroke-width="3" stroke-linecap="round"/>
  <!-- 금색 말풍선 (한마디) -->
  <path d="M6 28 a11 11 0 1 1 9 18 l-5 4 1-5.5 a11 11 0 0 1 -5-16.5 Z" fill="#C9A35A"/>
  <circle cx="9" cy="36.5" r="1.6" fill="#1E2830"/>
  <circle cx="13.5" cy="36.5" r="1.6" fill="#1E2830"/>
  <circle cx="18" cy="36.5" r="1.6" fill="#1E2830"/>
</svg>
