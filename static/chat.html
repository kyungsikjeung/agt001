<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>가게 채팅</title>
<style>
  :root {
    --accent: #4338ca; --accent-soft: #eef2ff; --bg: #f7f7f8; --surface: #fff;
    --border: #e5e7eb; --text: #1f2328; --muted: #52525b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.55;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
  }
  header h1 { margin: 0; font-size: 1.0625rem; }
  header p { margin: 0; font-size: 0.8125rem; color: var(--muted); }
  #log {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    max-width: 560px; width: 100%; margin: 0 auto; overscroll-behavior: contain;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-line; font-size: 0.9375rem; }
  .bot { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  /* 사장님 답 (GUEST_CHAT_CONTRACT §3-1): 다른 색 + 이름표 */
  .owner { background: #fff7ed; border: 1px solid #fdba74; align-self: flex-start; border-bottom-left-radius: 4px; }
  .owner .who { display: block; font-size: 0.75rem; font-weight: 700; color: #9a3412; margin-bottom: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 100%; }
  .chips button {
    min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 0.9375rem; font-weight: 600;
    border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .chips button:disabled { opacity: 0.45; cursor: default; }
  form {
    display: flex; gap: 8px; padding: 10px 12px; background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  form .wrap { display: flex; gap: 8px; max-width: 560px; width: 100%; margin: 0 auto; }
  input {
    flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
  }
  form button {
    min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 0.9375rem; cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 0.75rem; color: var(--muted); text-align: center; margin: 4px 0 0; }
  @media (prefers-reduced-motion: no-preference) {
    .msg, .chips { animation: in 160ms ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">가게 채팅</h1>
  <p>궁금한 것을 물어보세요. 모르는 것은 사장님이 직접 답해요.</p>
</header>
<div id="log" role="log" aria-live="polite"></div>
<form id="f" autocomplete="off">
  <div class="wrap">
    <input id="t" maxlength="300" placeholder="예: 내일 오후 3시 펌 돼요?" aria-label="메시지">
    <button type="submit">보내기</button>
  </div>
</form>
<script>
(() => {
  const key = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");
  const log = document.getElementById("log");
  const input = document.getElementById("t");
  let busy = false;
  let lastId = 0;        // 화면에 반영한 마지막 글 번호(서버 기준)
  let timer = null;      // 사장님 답 확인(4초)
  let ownerMode = false;
  let noted = false;     // 개인정보 안내는 처음 보낼 때 한 번

  function bubble(text, who) {
    if (!text) return;   // 빈 답(연달아 보낸 글)은 말풍선을 만들지 않는다
    const d = document.createElement("div");
    d.className = "msg " + who;
    if (who === "owner") {
      const w = document.createElement("span");
      w.className = "who";
      w.textContent = "사장님";
      d.appendChild(w);
      d.appendChild(document.createTextNode(text));
    } else {
      d.textContent = text;
    }
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function note(text) {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = text;
    log.appendChild(p);
  }

  // 사장님 답 받아 오기: 내가 쓴 글·AI 답은 이미 보였으니 사장님 글만 새로 그린다.
  async function poll(showAll) {
    try {
      const r = await fetch("/api/chat/" + encodeURIComponent(key) + "/messages?after=" + lastId,
                            { credentials: "same-origin" });
      if (!r.ok) return;
      const data = await r.json();
      for (const m of data.messages || []) {
        if (showAll || m.sender === "owner") bubble(m.text, m.sender === "guest" ? "me" : m.sender === "owner" ? "owner" : "bot");
        lastId = Math.max(lastId, m.id);
      }
      if (data.status === "owner") startPoll();
      if (data.status === "blocked" || data.status === "closed") stopPoll();
    } catch (e) { /* 다음 차례에 다시 */ }
  }
  function startPoll() {
    ownerMode = true;
    if (timer || document.hidden) return;
    timer = setInterval(() => poll(false), 4000);
  }
  function stopPoll() {
    if (timer) { clearInterval(timer); timer = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPoll();
    else if (ownerMode) { poll(false); startPoll(); }
  });

  function chips(buttons) {
    log.querySelectorAll(".chips button").forEach(b => { b.disabled = true; });
    if (!buttons || !buttons.length) return;
    const box = document.createElement("div");
    box.className = "chips";
    for (const b of buttons) {
      const el = document.createElement("button");
      el.type = "button";
      el.textContent = b.label;
      el.addEventListener("click", () => send({ action: b.action }, b.label));
      box.appendChild(el);
    }
    log.appendChild(box);
    log.scrollTop = log.scrollHeight;
  }

  async function send(body, shown) {
    if (busy) return;
    busy = true;
    if (shown) bubble(shown, "me");
    if (body.text && !noted) { noted = true; note("적어 주신 글은 가게에 전달되고 30일 뒤 지워져요."); }
    try {
      const r = await fetch("/api/chat/" + encodeURIComponent(key), {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (r.status === 429) { bubble("잠시 뒤에 다시 보내 주세요.", "bot"); return; }
      if (!r.ok) { bubble("연결이 잠시 끊겼어요. 다시 눌러 주세요.", "bot"); return; }
      const data = await r.json();
      bubble(data.reply, "bot");
      chips(data.buttons);
      if (data.mode === "owner") { await poll(false); startPoll(); }
    } catch (e) {
      bubble("연결이 잠시 끊겼어요. 다시 눌러 주세요.", "bot");
    } finally {
      busy = false;
    }
  }

  document.getElementById("f").addEventListener("submit", ev => {
    ev.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send({ text }, text);
  });

  // 다시 열면 지난 대화를 먼저 보이고(사장님 답 포함), 인사·단추를 붙인다.
  poll(true).finally(() => send({}, null));
})();
</script>
</body>
</html>
