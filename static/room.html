<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agt001 공유방</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
<style>
  :root {
    --accent: #6366f1;
    --accent-dark: #4338ca;
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #1f2328;
    --text-muted: #52525b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
  #memberCount { font-size: 0.8125rem; color: var(--text-muted); }
  #statusBar {
    padding: 8px 16px; font-size: 0.875rem; color: var(--accent-dark);
    background: #eef2ff; border-bottom: 1px solid var(--border);
    display: none; align-items: center; gap: 8px;
  }
  #statusBar.show { display: flex; }
  #statusBar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #statusBar .dot { animation: none; } }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.8125rem; font-weight: 600;
  }
  .bubble { max-width: 78%; }
  .meta { font-size: 0.8125rem; margin-bottom: 2px; }
  .meta .name { font-weight: 600; }
  .meta .time { color: var(--text-muted); font-size: 0.75rem; margin-left: 6px; }
  .text { font-size: 0.9375rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .kind-ai_reply .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .kind-ai_reply .avatar { background: var(--accent); }
  .kind-chat .avatar { background: #64748b; }
  .kind-system, .kind-vote { justify-content: center; }
  .kind-system .text, .kind-vote .text {
    color: var(--text-muted); font-size: 0.8125rem; text-align: center; background: none;
  }
  .badge-bot { font-size: 0.6875rem; background: var(--accent-dark); color: #fff; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

  #voteBar, #proceedBar {
    display: none; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border);
    gap: 8px; align-items: center; font-size: 0.875rem;
  }
  #voteBar.show, #proceedBar.show { display: flex; }
  /* 요구사항 질문의 선택지 버튼 (누르면 그 답이 바로 전송된다) */
  #choiceBar { display: none; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  #choiceBar.show { display: block; }
  #choiceBar .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  #choiceBar button { min-height: 44px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 0 16px; font-size: 0.9375rem; cursor: pointer; }
  #choiceBar button.on { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  #choiceBar button.done { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); font-weight: 600; }
  #choiceBar .hint { margin: 0 0 8px; font-size: 0.8125rem; color: var(--muted, #666); }
  #voteBar button, #proceedBar button {
    border: 1px solid var(--border); background: var(--bg); border-radius: 8px;
    padding: 8px 14px; font-size: 0.875rem; cursor: pointer;
  }
  #voteBar button.approve, #proceedBar button.go { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  #voteBar button:active, #proceedBar button:active { transform: scale(0.97); }

  #row {
    display: flex; gap: 8px; padding: 12px 16px; background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; }
  #sendBtn { padding: 10px 16px; font-size: 0.9375rem; border: none; border-radius: 8px; background: var(--accent-dark); color: #fff; cursor: pointer; white-space: nowrap; }
  #sendBtn:active { transform: scale(0.97); }

  #shareRow { padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  #shareBtn { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fee500; color: #191919; font-weight: 600; cursor: pointer; }

  #nicknameOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  #nicknameCard {
    background: var(--surface); border-radius: 12px; padding: 24px; max-width: 320px; width: 100%;
  }
  #nicknameCard h2 { margin: 0 0 8px; font-size: 1.125rem; }
  #nicknameCard p { margin: 0 0 16px; font-size: 0.875rem; color: var(--text-muted); }
  #nicknameInput { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
  #nicknameJoinBtn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent-dark); color: #fff; font-weight: 600; cursor: pointer; }

  @media (max-width: 480px) {
    header { padding: 10px 12px; }
    #log { padding: 12px; }
    .bubble { max-width: 86%; }
  }
</style>
</head>
<body>
  <header>
    <h1>agt001 요구사항 도출방</h1>
    <span id="memberCount"></span>
  </header>
  <div id="statusBar"><span class="dot"></span><span id="statusText"></span></div>
  <div id="log"></div>
  <div id="voteBar">
    <span>이 요구사항으로 견적을 진행할까요?</span>
    <button class="approve" onclick="vote('승인')">👍 승인</button>
    <button onclick="vote('거절')">거절</button>
  </div>
  <div id="proceedBar">
    <span>이 견적으로 진행할까요?</span>
    <button class="go" onclick="proceed('진행')">🚀 진행</button>
    <button onclick="proceed('취소')">취소</button>
  </div>
  <div id="choiceBar" aria-live="polite"><p class="hint" id="choiceHint"></p><div class="choices" id="choices"></div></div>
  <div id="row">
    <input id="input" placeholder="메시지를 입력하세요..." autocomplete="off">
    <button id="micBtn" type="button" aria-label="말로 입력" style="width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;padding:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></button>
    <button id="sendBtn" onclick="send()">보내기</button>
  </div>
  <div id="shareRow"><button id="shareBtn" onclick="shareInvite()">카카오톡으로 초대하기</button></div>

  <div id="nicknameOverlay">
    <div id="nicknameCard">
      <h2>공유방 입장</h2>
      <p>닉네임을 입력하면 다른 참여자에게 그 이름으로 보입니다.</p>
      <input id="nicknameInput" placeholder="닉네임" maxlength="20">
      <button id="nicknameJoinBtn" onclick="joinRoom()">입장하기</button>
    </div>
  </div>

<script>
const KAKAO_JS_KEY = 'db5e5247ff48a792df0cc393b4453c6d';
if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);

const log = document.getElementById('log');
const statusBar = document.getElementById('statusBar');
const statusText = document.getElementById('statusText');
const voteBar = document.getElementById('voteBar');
const proceedBar = document.getElementById('proceedBar');
const memberCountEl = document.getElementById('memberCount');

// 일부 환경(카카오톡 인앱 브라우저의 data: URL 렌더링 등)에서는 localStorage 접근 자체가
// SecurityError를 던진다. 이게 최상위에서 잡히지 않으면 스크립트 전체가 죽어서 이후
// 모든 버튼이 먹통이 된다 — 반드시 try/catch로 감싸고, 실패하면 메모리로만 동작(새로고침 시
// 닉네임 재입력)하게 degrade한다.
function safeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage 사용 불가 — 무시하고 계속 진행 */ }
}

// crypto.randomUUID()는 "secure context"(HTTPS/localhost)에서만 지원된다.
// OCI 배포본은 평문 HTTP(http://144.24.91.250:8643)라서 이 함수 자체가 없을 수 있다 —
// 없으면 폴백으로 직접 UUID v4 형태 문자열을 만든다 (암호학적으로 엄밀하지 않아도 충분 —
// 방 참여자 구분용 ID일 뿐이다).
function makeMemberId() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

let roomId = new URLSearchParams(location.search).get('room');
let memberId = safeGet('agt001_member_id');
let nickname = safeGet('agt001_nickname');
let lastSeq = 0;
let pollTimer = null;

const STATUS_LABEL = {
  IDLE: '', RAG_SEARCHING: '🔍 과거 프로젝트를 검색 중...', THINKING: '🤖 AI가 생각 중...',
  QUOTING: '🧾 견적을 계산 중...', GENERATING: '⚙️ 코드 생성 중... (최대 90초)', DONE: '✅ 완료',
};

function hueFromString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function addMessage(m) {
  const row = document.createElement('div');
  row.className = 'row kind-' + m.kind;
  if (m.kind === 'chat' || m.kind === 'ai_reply') {
    const av = document.createElement('div');
    av.className = 'avatar';
    if (m.kind === 'ai_reply') {
      av.textContent = '🤖';
    } else {
      av.textContent = m.nickname.slice(0, 1);
      av.style.background = `hsl(${hueFromString(m.nickname)}, 55%, 45%)`;
    }
    row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (m.kind === 'chat' || m.kind === 'ai_reply') {
    const meta = document.createElement('div');
    meta.className = 'meta';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = m.nickname;
    meta.appendChild(nameSpan);
    if (m.kind === 'ai_reply') {
      const badge = document.createElement('span');
      badge.className = 'badge-bot';
      badge.textContent = 'BOT';
      meta.appendChild(badge);
    }
    bubble.appendChild(meta);
  }
  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = m.text;
  bubble.appendChild(text);
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function updateStatus(aiStatus) {
  const label = STATUS_LABEL[aiStatus] || '';
  if (label && aiStatus !== 'DONE' && aiStatus !== 'IDLE') {
    statusText.textContent = label;
    statusBar.classList.add('show');
  } else {
    statusBar.classList.remove('show');
  }
}

// 요구사항 질문의 선택지를 버튼으로 그린다. 같은 질문이면 다시 그리지 않는다(누르던 선택이 사라지지 않게).
const choiceBar = document.getElementById('choiceBar');
const choicesEl = document.getElementById('choices');
const choiceHint = document.getElementById('choiceHint');
let choiceKey = '';
function renderChoices(q) {
  const key = q ? JSON.stringify(q) : '';
  if (key === choiceKey) return;
  choiceKey = key;
  choicesEl.innerHTML = '';
  if (!q) { choiceBar.classList.remove('show'); return; }
  const picked = new Set();
  choiceHint.textContent = q.kind === 'multi' ? '해당되는 것을 모두 누른 뒤 "선택 완료"를 눌러 주세요'
    : q.owner_only ? '방장님이 눌러 주세요' : '누르면 바로 답이 전송돼요. 직접 적어도 돼요';
  for (const opt of q.options) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = opt;
    if (q.kind === 'multi') {
      b.setAttribute('aria-pressed', 'false');
      b.onclick = () => {
        if (opt === '없음') { choiceBar.classList.remove('show'); sendRoomMessage('없음'); return; }
        if (picked.has(opt)) { picked.delete(opt); b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }
        else { picked.add(opt); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); }
      };
    } else {
      b.onclick = () => { choiceBar.classList.remove('show'); sendRoomMessage(opt); };
    }
    choicesEl.appendChild(b);
  }
  if (q.kind === 'multi') {
    const done = document.createElement('button');
    done.type = 'button';
    done.className = 'done';
    done.textContent = '선택 완료';
    done.onclick = () => { choiceBar.classList.remove('show'); sendRoomMessage(picked.size ? [...picked].join(', ') : '없음'); };
    choicesEl.appendChild(done);
  }
  choiceBar.classList.add('show');
}

function updateActionBars(state) {
  voteBar.classList.toggle('show', state === 'AWAIT_APPROVAL');
  proceedBar.classList.toggle('show', state === 'QUOTED');
}

// 4초 간격 setInterval 폴링과, 메시지 전송 직후 수동 호출(sendRoomMessage → pollMessages)이
// 동시에 겹치면 둘 다 같은 lastSeq 값으로 조회를 시작해 같은 메시지를 중복 렌더링하는
// 경쟁 상태(race condition)가 생긴다 — 실측 재현됨("자신이 보낸 메시지가 자신에게 중복").
// 진행 중인 호출이 있으면 새 호출은 건너뛰어(no-op) 한 번에 하나만 실행되게 한다.
let pollInFlight = false;
async function pollMessages() {
  if (!roomId || pollInFlight) return;
  pollInFlight = true;
  try {
    const res = await fetch(`/room/${roomId}/messages?since=${lastSeq}`, { headers: { 'X-Member-Id': memberId } });
    if (!res.ok) return;
    const data = await res.json();
    for (const m of data.messages) addMessage(m);
    if (data.messages.length) lastSeq += data.messages.length;
    updateStatus(data.ai_status);
    updateActionBars(data.state);
    renderChoices(data.question || null);
    memberCountEl.textContent = data.members.length ? `${data.members.length}명 참여 중` : '';
  } finally {
    pollInFlight = false;
  }
}

async function sendRoomMessage(text) {
  const res = await fetch(`/room/${roomId}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ member_id: memberId, nickname, message: text }),
  });
  await pollMessages();
  return res.ok ? res.json() : null;
}

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendRoomMessage(text);
}

function vote(choice) { sendRoomMessage(choice); }
function proceed(choice) { sendRoomMessage(choice); }

function shareInvite() {
  const url = new URL(location.href);
  url.search = `?room=${roomId}`;
  const absUrl = url.href;
  if (!window.Kakao || !Kakao.isInitialized()) { alert('카카오 SDK 로딩에 실패했습니다.'); return; }
  Kakao.Share.sendDefault({
    objectType: 'feed',
    content: {
      title: 'agt001 요구사항 도출방 초대',
      description: '함께 요구사항을 정리해봐요! AI가 견적까지 도와드려요.',
      imageUrl: 'https://placehold.co/600x400?text=agt001',
      link: { mobileWebUrl: absUrl, webUrl: absUrl },
    },
    buttons: [{ title: '방 입장하기', link: { mobileWebUrl: absUrl, webUrl: absUrl } }],
  });
}

async function ensureRoom() {
  if (roomId) return;
  const res = await fetch('/room', { method: 'POST' });
  const data = await res.json();
  roomId = data.room_id;
  const url = new URL(location.href);
  url.searchParams.set('room', roomId);
  history.replaceState(null, '', url);
}

function joinRoom() {
  const input = document.getElementById('nicknameInput');
  const value = input.value.trim();
  if (!value) { input.focus(); return; }
  nickname = value;
  safeSet('agt001_nickname', nickname);
  document.getElementById('nicknameOverlay').remove();
  startRoom();
}

async function startRoom() {
  await ensureRoom();
  if (!memberId) {
    memberId = makeMemberId();
    safeSet('agt001_member_id', memberId);
  }
  // 온보딩 안내: 서버에 남기지 않는 프론트 1회성 표시. 정말 새 방일 때만 보여준다.
  // 참여자가 아니면 기록을 조회할 수 없으므로(ROOM_POLICY.md R-0), 새 방인지는
  // 입장 응답의 fresh(입장 전 메시지가 하나도 없었는지)로 판단한다.
  const joined = await sendRoomMessage('');
  if (pending) {
    // 랜딩에서 적은 내용을 첫 메시지로 보낸다. 사용자가 이미 설명했으므로 안내 메시지는 생략한다.
    await sendRoomMessage(pending.text);
  } else if (joined && joined.fresh) {
    showOnboarding();
  }
  pollTimer = setInterval(pollMessages, 4000);
}

// 새 방 첫 입장 시 1회만 보여주는 온보딩 안내.
// kind=ai_reply로 렌더링해서 AI가 직접 소개하는 느낌으로 보여준다.
// 서버 messages 배열에는 저장하지 않는다(프론트 표시 전용이므로 seq/lastSeq와
// 무관하고, 이후 폴링·투표·진행 등 기존 기능에 영향을 주지 않는다).
const ONBOARDING_TEXT =
  '안녕하세요! 저는 웹사이트 제작을 돕는 AI 어시스턴트입니다. 🤖\n\n' +
  '원하는 걸 편하게 말씀해 보세요. 함께 요구사항을 정리하고, 견적을 내고, ' +
  '실제로 열리는 시안 페이지와 코드까지 만들어 드립니다.\n\n' +
  '예를 들면 이런 것들이에요:\n' +
  '• 카페/스터디카페 예약 페이지 (날짜·시간 예약, 메뉴 소개)\n' +
  '• 회사·가게 소개 랜딩페이지\n' +
  '• 상품 소개 + 문의 폼 페이지\n\n' +
  '먼저 만들고 싶은 것을 한 문장으로 적어주세요. (예: "카페 예약 웹사이트 만들고 싶어요")';

function showOnboarding() {
  addMessage({ kind: 'ai_reply', nickname: 'AI 어시스턴트', text: ONBOARDING_TEXT });
}

document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// 랜딩(frontend/src/api.ts)에서 넘어온 첫 메시지. 이 방의 것일 때만 한 번 쓰고 지운다.
let pending = null;
try {
  const raw = sessionStorage.getItem('agt001_pending_message');
  if (raw) {
    const p = JSON.parse(raw);
    if (p && p.roomId === roomId && typeof p.text === 'string') pending = p;
    sessionStorage.removeItem('agt001_pending_message');
  }
} catch (e) { /* 저장소를 못 쓰면 평소처럼 시작 */ }
// 랜딩에서 바로 온 사람은 닉네임 입력 없이 시작한다(저장하지 않아 다른 방에는 영향 없음).
if (!nickname && pending) nickname = '사장님';

if (nickname) {
  document.getElementById('nicknameOverlay').remove();
  startRoom();
}
// nickname 없을 때는 #nicknameJoinBtn의 inline onclick="joinRoom()"이 처리한다 (중복 리스너 금지).
</script>
<script src="/voice.js" defer></script>
</body>
