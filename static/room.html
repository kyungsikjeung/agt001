<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한마디 공유방</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
<style>
  :root {
    --accent: #6366f1;
    --accent-dark: #4338ca;
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #1f2328;
    --text-muted: #52525b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
  #memberCount {
    font-size: 0.8125rem; color: var(--text-muted);
    background: none; border: 1px solid transparent; border-radius: 8px;
    padding: 8px 10px; min-height: 44px; cursor: pointer;
  }
  #memberCount:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #statusBar {
    padding: 8px 16px; font-size: 0.875rem; color: var(--accent-dark);
    background: #eef2ff; border-bottom: 1px solid var(--border);
    display: none; align-items: center; gap: 8px;
  }
  #statusBar.show { display: flex; }
  #statusBar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #statusBar .dot { animation: none; } }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.8125rem; font-weight: 600;
  }
  .bubble { max-width: 78%; }
  .meta { font-size: 0.8125rem; margin-bottom: 2px; }
  .meta .name { font-weight: 600; }
  .meta .time { color: var(--text-muted); font-size: 0.75rem; margin-left: 6px; }
  .text { font-size: 0.9375rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .kind-ai_reply .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .kind-ai_reply .avatar { background: var(--accent); }
  .kind-chat .avatar { background: #64748b; }
  .kind-system, .kind-vote { justify-content: center; }
  .kind-system .text, .kind-vote .text {
    color: var(--text-muted); font-size: 0.8125rem; text-align: center; background: none;
  }
  /* 타이머 사전 경고 (노란 톤 시스템 메시지) */
  .kind-warning { justify-content: center; }
  .kind-warning .bubble { max-width: 90%; background: #fef9c3; border: 1px solid #f5c26b; border-radius: 10px; padding: 10px 12px; }
  .kind-warning .text { color: #713f12; font-size: 0.8125rem; text-align: center; white-space: pre-wrap; }
  /* 사진 메시지 썸네일 */
  .kind-photo .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .kind-photo .avatar { background: #64748b; }
  .photo-thumb { display: block; margin-top: 8px; border-radius: 8px; overflow: hidden; max-width: 240px; }
  .photo-thumb img { width: 100%; height: auto; display: block; background: #e5e7eb; }
  /* 사이트 문의 알림 (플랫폼 공용 ①) */
  .kind-inquiry { justify-content: center; }
  .kind-inquiry .bubble { max-width: 90%; background: #fff7e6; border: 1px solid #f5c26b; border-radius: 10px; padding: 10px 12px; color: #3d2a00; }
  .kind-inquiry .text { white-space: pre-wrap; }
  /* 예약 신청 알림 (플랫폼 공용 ②, 문의 노란색과 구별되는 연한 초록) */
  .kind-booking { justify-content: center; }
  .kind-booking .bubble { max-width: 90%; background: #e9f7ef; border: 1px solid #8fd0a4; border-radius: 10px; padding: 10px 12px; color: #123d22; }
  .kind-booking .text { white-space: pre-wrap; }
  .kind-booking .text a[href^="tel:"] { color: var(--accent-dark); }
  .booking-result { margin-top: 10px; display: flex; gap: 8px; }
  .booking-result button { flex: 1; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  .booking-result button.go { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  .booking-note { margin-top: 10px; font-size: 0.8125rem; color: #14532d; }
  .badge-bot { font-size: 0.6875rem; background: var(--accent-dark); color: #fff; padding: 2px 8px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  /* 시안 3안 고르기 카드 */
  .design-pick { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; scroll-snap-type: x mandatory; }
  .design-card { flex: 0 0 78%; max-width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; scroll-snap-align: start; }
  .design-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .design-thumb { width: 100%; aspect-ratio: 390 / 780; border-radius: 6px; overflow: hidden; background: #e5e7eb; display: flex; align-items: center; justify-content: center; }
  .design-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .design-fallback { font-size: 0.8125rem; color: var(--text-muted); }
  .design-title { font-size: 0.875rem; font-weight: 600; margin: 8px 0; }
  .design-badge { display: none; font-size: 0.75rem; font-weight: 700; color: var(--accent-dark); margin-left: 6px; }
  .design-card.on .design-badge { display: inline; }
  .design-row { display: flex; gap: 8px; align-items: center; }
  .design-pick-btn { flex: 1; min-height: 44px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; font-size: 0.875rem; cursor: pointer; }
  .design-card.on .design-pick-btn { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  .design-open { font-size: 0.8125rem; color: var(--accent-dark); }
  .design-pick-btn:focus-visible, .design-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* P0: 시안별 차이 1줄 (D43 역할고정 사용자 언어) */
  .design-diff { font-size: 0.75rem; color: var(--text-muted); margin: 0 0 8px; }
  /* P0: 질문 진행바 (얇은 바 + 한 줄 안내, 360px 1줄) */
  #progressWrap { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted); }
  #progressWrap[hidden] { display: none; }
  #progressTrack { flex: none; width: 72px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  #progressFill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s ease-out; }
  #progressText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* P0: 출처 라벨 (AI 정리) · 견적 고지 (참고용) · 문의 보관 안내 */
  .src-note, .quote-note, .inquiry-note { font-size: 0.75rem; border-radius: 6px; padding: 6px 8px; margin-top: 8px; }
  .src-note { background: #eef2ff; color: var(--accent-dark); }
  .quote-note { background: #fff7e6; border: 1px solid #f5c26b; color: #713f12; }
  .inquiry-note { background: none; color: var(--text-muted); padding: 4px 0 0; }
  /* P0: 시안 썸네일 로딩 (종횡비 고정 + 쉬머, 로드 후 페이드인) */
  .design-thumb img { opacity: 0; transition: opacity .2s ease-out; }
  .design-thumb img.loaded { opacity: 1; }
  .design-thumb.loading { background: linear-gradient(100deg, #e5e7eb 40%, #f3f4f6 50%, #e5e7eb 60%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  /* P0+P1: 시안 크게 보기 바텀시트 (문맥 유지 1순위, 새 탭은 시트 안 2순위) */
  #designSheetWrap { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 28; display: flex; align-items: flex-end; justify-content: center; }
  #designSheetWrap[hidden] { display: none; }
  #designSheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 12px 12px 0 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; max-height: 88dvh; }
  #designSheet h2 { margin: 0; font-size: 1rem; }
  #designSheetDiff { margin: 0; font-size: 0.8125rem; color: var(--text-muted); }
  #designSheetImg { width: 100%; aspect-ratio: 390 / 780; object-fit: cover; border-radius: 8px; background: #e5e7eb; }
  #designSheetRow { display: flex; gap: 8px; }
  #designSheetPick { flex: 1; min-height: 44px; border: none; border-radius: 8px; background: var(--accent-dark); color: #fff; font-weight: 600; cursor: pointer; }
  #designSheetOpen { flex: 1; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--accent-dark); font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.875rem; }
  #designSheetClose { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-weight: 600; cursor: pointer; }
  /* P1: 말풍선·선택 마이크로모션 (줄인 움직임 선호 존중) */
  @media (prefers-reduced-motion: no-preference) {
    .row { animation: rise .12s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .design-card { transition: border-color .15s ease-out, box-shadow .15s ease-out; }
    #choiceBar button:active { transform: scale(0.97); }
  }
  @media (prefers-reduced-motion: reduce) {
    .design-thumb.loading { animation: none; }
    #progressFill { transition: none; }
    .design-thumb img { transition: none; }
  }

  #voteBar, #proceedBar {
    display: none; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border);
    gap: 8px; align-items: center; font-size: 0.875rem;
  }
  #voteBar.show, #proceedBar.show { display: flex; }
  /* 요구사항 질문의 선택지 버튼 (누르면 그 답이 바로 전송된다) */
  #choiceBar { display: none; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  #choiceBar.show { display: block; }
  #choiceBar .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  #choiceBar button { min-height: 44px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 0 16px; font-size: 0.9375rem; cursor: pointer; }
  #choiceBar button.on { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  #choiceBar button.done { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); font-weight: 600; }
  #choiceBar .hint { margin: 0 0 8px; font-size: 0.8125rem; color: var(--muted, #666); }
  #voteBar button, #proceedBar button {
    border: 1px solid var(--border); background: var(--bg); border-radius: 8px;
    padding: 8px 14px; font-size: 0.875rem; cursor: pointer;
  }
  #voteBar button.approve, #proceedBar button.go { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  #voteBar button:active, #proceedBar button:active { transform: scale(0.97); }
  #voteBar button:disabled { opacity: 0.6; cursor: default; }
  #voteBar #voteText { flex: 1; min-width: 0; }
  #voteBar button { flex: none; white-space: nowrap; min-height: 44px; }
  /* D52: 공유방 보낼 곳 전환 (AI에게 / 우리끼리) */
  #talkModeBar { display: flex; gap: 8px; align-items: center; padding: 8px 16px 0; background: var(--surface); border-top: 1px solid var(--border); font-size: 0.8125rem; }
  #talkModeBar[hidden] { display: none; }
  #talkModeBar button { min-height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); font-size: 0.8125rem; cursor: pointer; }
  #talkModeBar button[aria-pressed="true"] { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  .row.aside .bubble { background: transparent; border: 1px dashed var(--border); border-radius: 12px; padding: 8px 12px; }
  .aside-tag { font-size: 0.6875rem; color: var(--text-muted); margin-left: 6px; }

  #row {
    display: flex; gap: 8px; padding: 12px 16px; background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; }
  #sendBtn { padding: 10px 16px; font-size: 0.9375rem; border: none; border-radius: 8px; background: var(--accent-dark); color: #fff; cursor: pointer; white-space: nowrap; }
  #sendBtn:active { transform: scale(0.97); }

  #toolBar {
    display: flex; gap: 8px; padding: 8px 12px; background: var(--surface);
    border-top: 1px solid var(--border); align-items: center; min-height: 60px;
    flex-wrap: nowrap; overflow: hidden;
  }
  #inviteOpenBtn {
    flex: 1; min-width: 0; min-height: 44px; padding: 0 14px; border: 1px solid var(--border);
    border-radius: 8px; background: #fee500; color: #191919; font-weight: 600;
    font-size: 0.875rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #inviteOpenBtn[hidden] { display: none; }
  #moreBtn {
    flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); font-size: 0.875rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  /* 무전기 줄은 더보기 안으로 옮기므로 본문에서는 숨긴다 (voice.js가 만든다) */
  #walkieRow { display: none !important; }
  #walkieSlot { display: flex; flex-direction: column; gap: 8px; }
  #walkieSlot:empty { display: none; }
  /* 더보기 펼침은 아래에서 올라오는 겹침 패널 (본문 높이에 더하지 않는다) */
  #moreSheetWrap { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 25; display: flex; align-items: flex-end; justify-content: center; }
  #moreSheetWrap[hidden] { display: none; }
  #moreSheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 12px 12px 0 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; max-height: 70dvh; overflow-y: auto; }
  #moreSheet h2 { margin: 0; font-size: 1rem; }
  #moreSheet button, #moreSheet a.more-item { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 0 14px; font-size: 0.875rem; font-weight: 600; cursor: pointer; color: var(--text); text-decoration: none; display: flex; align-items: center; justify-content: center; }
  #moreSheet a.more-item { background: var(--surface); color: var(--accent-dark); }
  #moreSheet [hidden] { display: none !important; }
  #talkNotifyBtn[disabled] { opacity: 0.7; cursor: default; }
  #moreLeaveBtn { border-color: #f5c26b !important; background: #fff7e6 !important; color: #713f12 !important; }
  #inviteNotice { margin: 0; font-size: 0.8125rem; color: var(--text-muted); text-align: center; }
  /* 초대 대화상자는 화면 가운데 겹침 (본문 높이에 더하지 않는다) */
  #inviteDialogWrap { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #inviteDialogWrap[hidden] { display: none; }
  #inviteDialog { background: var(--surface); border-radius: 12px; padding: 20px; max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 12px; max-height: 80dvh; overflow-y: auto; }
  #inviteDialog h2 { margin: 0; font-size: 1rem; }
  #inviteFormRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #inviteDays { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font-size: 0.875rem; background: var(--bg); }
  #inviteCreateBtn { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 0 14px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  #inviteLastRow { display: flex; gap: 8px; }
  #inviteLastRow button { flex: 1; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 0.8125rem; font-weight: 600; cursor: pointer; }
  #inviteList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #inviteList li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.8125rem; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
  #inviteList li .info { flex: 1; min-width: 0; color: var(--text-muted); word-break: break-word; }
  #inviteList li button { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 0 12px; font-size: 0.8125rem; cursor: pointer; }
  #inviteMsg { margin: 0; font-size: 0.8125rem; color: var(--text-muted); }
  #inviteDialogClose { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-weight: 600; cursor: pointer; }
  #photoBtn { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); cursor: pointer; font-size: 1rem; padding: 0; }
  #photoStatus { padding: 8px 16px; font-size: 0.8125rem; color: var(--text-muted); background: var(--surface); border-top: 1px solid var(--border); display: none; }
  #photoStatus.show { display: block; }
  /* 참여자 목록 패널 (머리글 인원 수 버튼으로 열림) */
  #memberPanelWrap { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; justify-content: flex-end; padding: 0; }
  #memberPanelWrap[hidden] { display: none; }
  #memberPanel { background: var(--surface); width: min(320px, 100%); height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  #memberPanelHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #memberPanelHead h2 { margin: 0; font-size: 1rem; }
  #memberPanelClose { min-width: 44px; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; }
  #memberList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #memberList li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.875rem; }
  #memberList .nick { flex: 1; min-width: 0; font-weight: 600; word-break: break-word; }
  #memberList .transferBtn { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 0 12px; font-size: 0.8125rem; cursor: pointer; }
  #leaveBtn { min-height: 44px; border: 1px solid #f5c26b; border-radius: 8px; background: #fff7e6; color: #713f12; font-weight: 600; cursor: pointer; }
  /* 화면 안 대화상자 (방장 넘기기 확인용, window.confirm 대신) */
  #ownerDialogWrap { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #ownerDialogWrap[hidden] { display: none; }
  #ownerDialog { background: var(--surface); border-radius: 12px; padding: 20px; max-width: 320px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
  #ownerDialog h2 { margin: 0; font-size: 1rem; }
  #ownerDialog p { margin: 0; font-size: 0.875rem; color: var(--text-muted); }
  #ownerDialogBtns { display: flex; gap: 8px; }
  #ownerDialogBtns button { flex: 1; min-height: 44px; border-radius: 8px; cursor: pointer; font-size: 0.875rem; font-weight: 600; }
  #ownerConfirmBtn { border: 1px solid var(--accent-dark); background: var(--accent-dark); color: #fff; }
  #ownerCancelBtn { border: 1px solid var(--border); background: var(--bg); }

  #nicknameOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  #nicknameCard {
    background: var(--surface); border-radius: 12px; padding: 24px; max-width: 320px; width: 100%;
  }
  #nicknameCard h2 { margin: 0 0 8px; font-size: 1.125rem; }

function safeGet(key) {

function safeSet(key, value) {

}

// crypto.randomUUID()는 "secure context"(HTTPS/localhost)에서만 지원된다.

// 없으면 폴백으로 직접 UUID v4 형태 문자열을 만든다 (암호학적으로 엄밀하지 않아도 충분 —
// 방 참여자 구분용 ID일 뿐이다).
function makeMemberId() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();

  // 시안 카드 3개 묶음 만들기

// 예약 알림 말풍선 작은 함수들 (플랫폼 공용 ②, BOOKING_PLAN §2.4)
function isBookingOwner() {
  // 방장 판단은 기존 isOwner를 먼저 쓰고, 서버가 아직 안 주면 첫 참여자와 내 표시를 견준다.
  if (typeof isOwner === 'function' && roomMe && typeof roomMe.is_owner === 'boolean') return isOwner();
  if (roomMe && roomMe.member_handle && roomMembers.length) {
    return roomMembers[0].member_handle === roomMe.member_handle;
  }
  return false;
}
// 방장·결정 여부에 따라 보여줄 한 줄 글자
function bookingStatusText(status, mine) {
  if (status === 'confirmed') return mine ? '확정했어요' : '확정됐어요';
  if (status === 'declined') return mine ? '거절했어요' : '거절됐어요';
  return mine ? '예약 신청이에요. 확정하거나 거절해 주세요.' : '사장님이 확인 중이에요';
}
// 본문을 그대로 두되 전화번호만 tel: 고리로 만든다. innerHTML은 쓰지 않는다.
function appendPhoneLinkedText(box, raw) {
  const s = raw || '';
  const re = /\d{2,4}-\d{3,4}-\d{4}|\d{10,11}/g;
  let last = 0;
  let mm = null;
  let found = false;
  while ((mm = re.exec(s)) !== null) {
    found = true;
    if (mm.index > last) box.appendChild(document.createTextNode(s.slice(last, mm.index)));
    const shown = mm[0];
    const dial = shown.replace(/[^0-9]/g, '');
    const link = document.createElement('a');
    link.href = 'tel:' + dial;
    link.textContent = shown;
    box.appendChild(link);
    last = mm.index + shown.length;
  }
  if (!found) {
    box.textContent = s;
    return;
  }
  if (last < s.length) box.appendChild(document.createTextNode(s.slice(last)));
}
// 예약 말풍선 아래쪽: 방장이면 버튼, 아니면 글자만
function buildBookingArea(bubble, m) {
  const info = (m && m.booking) || {};
  const mine = isBookingOwner();
  const area = document.createElement('div');
  area.className = 'booking-result';
  if (info.id != null) area.setAttribute('data-booking-result', String(info.id));
  const note = document.createElement('div');

  if (info.id != null) note.setAttribute('data-booking-note', String(info.id));
  if (info.status === 'requested' && mine) {
    const ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'go';
    ok.textContent = '확정';
    ok.setAttribute('aria-label', '예약 확정하기');
    const no = document.createElement('button');
    no.type = 'button';
    no.textContent = '거절';
    no.setAttribute('aria-label', '예약 거절하기');
    ok.onclick = () => decideBooking(info.id, 'confirm', area, note, ok, no);
    no.onclick = () => decideBooking(info.id, 'decline', area, note, ok, no);
    area.appendChild(ok);
    area.appendChild(no);
    note.textContent = bookingStatusText('requested', true);
    bubble.appendChild(area);
    bubble.appendChild(note);
    return;
  }
  note.textContent = bookingStatusText(info.status || 'requested', mine);
  bubble.appendChild(note);
}
// 확정·거절 누름 처리
async function decideBooking(id, decision, area, note, okBtn, noBtn) {
  if (okBtn) okBtn.disabled = true;
  if (noBtn) noBtn.disabled = true;
  try {
    const res = await fetch('/room/' + encodeURIComponent(roomId) + '/bookings/' + encodeURIComponent(id) + '/decision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
      body: JSON.stringify({ decision }),
    });
    if (res.ok) {
      let status = decision === 'confirm' ? 'confirmed' : 'declined';
      try {
        const data = await res.json();
        if (data && data.status) status = data.status;
      } catch (e) { /* 본문이 없어도 누른 값으로 표시 */ }
      area.replaceChildren();
      note.textContent = bookingStatusText(status, true);
      return;
    }
    if (okBtn) okBtn.disabled = false;
    if (noBtn) noBtn.disabled = false;
    if (res.status === 403) note.textContent = '방장만 결정할 수 있어요.';
    else if (res.status === 409) {
      note.textContent = '이미 결정된 예약이에요.';
      area.replaceChildren();
    } else note.textContent = '지금은 처리할 수 없어요. 잠시 뒤에 다시 시도해 주세요.';
  } catch (e) {
    if (okBtn) okBtn.disabled = false;
    if (noBtn) noBtn.disabled = false;
    note.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.';
  }
}
// 들어올 때 한 번: 이미 결정된 예약은 버튼 대신 결과 글자로 바꾼다. 실패는 조용히.
let bookingStatesLoaded = false;
async function refreshBookingStates() {
  if (!isBookingOwner()) return;
  let data = null;
  try {
    const res = await fetch('/room/' + encodeURIComponent(roomId) + '/bookings', { headers: { 'X-Member-Id': memberId } });
    if (!res.ok) return;
    data = await res.json();
  } catch (e) { return; }
  const list = (data && data.bookings) || [];
  const mine = isBookingOwner();
  for (const b of list) {
    if (b == null || b.id == null) continue;
    if (b.status === 'requested') continue;
    const sel = '[data-booking-result="' + String(b.id) + '"]';
    const area = document.querySelector(sel);
    if (area) area.replaceChildren();
    const note = document.querySelector('[data-booking-note="' + String(b.id) + '"]');
    if (note) note.textContent = bookingStatusText(b.status, mine);
  }
}

function addMessage(m, isNew) {
  const row = document.createElement('div');
  row.className = 'row kind-' + m.kind;
  // 예약 알림은 문의와 다른 연한 초록 말풍선으로 그린다. 읽어주기·투표 등 기존 동작은 손대지 않는다.
  if (m.kind === 'booking') {
    const info = (m && m.booking) || {};
    if (info.id != null) row.setAttribute('data-booking-id', String(info.id));
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const text = document.createElement('div');
    text.className = 'text';
    appendPhoneLinkedText(text, m.text || '');
    bubble.appendChild(text);
    buildBookingArea(bubble, m);
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return;
  }
  const safeName = (m.nickname || '').slice(0, 40);
  if (m.kind === 'chat' || m.kind === 'ai_reply' || m.kind === 'photo') {
    const av = document.createElement('div');
    av.className = 'avatar';
    if (m.kind === 'ai_reply') {
      av.textContent = '🤖';
    } else {
      av.textContent = safeName.slice(0, 1);
      av.style.background = `hsl(${hueFromString(safeName || '?')}, 55%, 45%)`;
    }
    row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (m.kind === 'chat' || m.kind === 'ai_reply' || m.kind === 'photo') {
    const meta = document.createElement('div');
    meta.className = 'meta';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = safeName;
    meta.appendChild(nameSpan);
    if (m.kind === 'ai_reply') {
      const badge = document.createElement('span');
      badge.className = 'badge-bot';
      badge.textContent = 'BOT';
      meta.appendChild(badge);
    }
    if (m.aside) {
      row.classList.add('aside');
      const tag = document.createElement('span');
      tag.className = 'aside-tag';
      tag.textContent = '우리끼리 · AI는 읽지 않아요';
      meta.appendChild(tag);
    }
    bubble.appendChild(meta);
  }
  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = m.text || '';
  bubble.appendChild(text);
  // P0: 출처 라벨 — AI가 정리한 요구사항 되짚기에는 근거 표시를 붙인다
  if (m.kind === 'ai_reply' && /이렇게 이해했어요|다시 읽어 보니|빠진 게 있어/.test(m.text || '')) {
    const src = document.createElement('div');
    src.className = 'src-note';
    src.textContent = '사장님 말씀 기반 AI 정리 · 틀리면 고쳐주세요';
    bubble.appendChild(src);
  }
  // P0: 견적 고지 — 참고용임을 카드 안에서 분명히 한다 (확정 금액 오해 방지)
  if (/참고 견적:/.test(m.text || '')) {
    const qn = document.createElement('div');
    qn.className = 'quote-note';
    qn.textContent = '참고용 · 확정 금액이 아니에요 · 베타 기간 무료';
    bubble.appendChild(qn);
  }
  // P1: 문의 보관 안내 — 저장 기간을 알림 안에서 밝힌다
  if (m.kind === 'inquiry') {
    const iq = document.createElement('div');
    iq.className = 'inquiry-note';
    iq.textContent = '문의 내용은 30일간 보관돼요';
    bubble.appendChild(iq);
  }
  // 사진 메시지는 썸네일로 보여주고 누르면 생성물 주소로 연다.
  if (m.kind === 'photo' && m.photo && m.photo.url) {
    const link = document.createElement('a');
    link.className = 'photo-thumb';
    link.href = m.photo.url;
    link.target = '_blank';
    link.rel = 'noopener';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '올린 사진';
    img.src = m.photo.url;
    link.appendChild(img);
    bubble.appendChild(link);
  }
  // AI 답장 말풍선에만 작은 "듣기" 버튼을 단다. 재생은 voice.js의 window.speakAiText가 맡는다.
  if (m.kind === 'ai_reply') {
    const listenBtn = document.createElement('button');
    listenBtn.type = 'button';
    listenBtn.textContent = '듣기';
    listenBtn.setAttribute('aria-label', '답장 듣기');
    listenBtn.style.cssText = 'margin-top:8px;font-size:0.75rem;min-height:32px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--text);cursor:pointer;';
    listenBtn.onclick = () => {
      if (typeof window.speakAiText === 'function') window.speakAiText(m.text, listenBtn);
    };
    bubble.appendChild(listenBtn);
    // 새로 도착한 답장만 자동으로 읽는다. 지난 답장과 첫 안내 글은 듣기 버튼으로만 듣는다.
    if (isNew && typeof window.queueWalkieTts === 'function') {
      try { window.queueWalkieTts(m.text, listenBtn); } catch (e) { /* 자동 읽기는 실패해도 말풍선 유지 */ }
    }
  }
  // 시안 고르기: 선택 번호를 기억하고 AI 안내 글 아래에 카드 3개를 단다
  const sayNo = findPickedNo(m.text);
  if (sayNo) pickedDesignNo = sayNo;
  const fixNo = findConfirmedNo(m.text);
  if (fixNo) pickedDesignNo = fixNo;
  if (m.kind === 'ai_reply') {
    const did = findDesignId(m.text);
    if (did) buildDesignCards(bubble, did);
  }
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  if (pickedDesignNo) refreshDesignMarks();
}

function updateStatus(aiStatus) {
  const label = STATUS_LABEL[aiStatus] || '';
  const busy = !!label && aiStatus !== 'DONE' && aiStatus !== 'IDLE';
  if (busy) {
    statusText.textContent = label;
    statusBar.classList.add('show');
    statusBar.setAttribute('role', 'progressbar');
    statusBar.setAttribute('aria-busy', 'true');
  } else {
    statusBar.classList.remove('show');
    statusBar.removeAttribute('role');
    statusBar.removeAttribute('aria-busy');
  }
}

// P0: 질문 진행바 (서버 asked/budget 없이 로컬 집계. 총합을 단정하지 않고 N번째만 보인다)
let questionCount = 0;
function updateProgress() {
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  if (!wrap || !fill || !text) return;
  if (!questionCount) { wrap.hidden = true; return; }
  wrap.hidden = false;
  fill.style.width = Math.min(100, Math.round((questionCount / 8) * 100)) + '%';
  text.textContent = '질문 ' + questionCount + ' · ‘시안 먼저’라고 하면 건너뜰 수 있어요';
}

// 요구사항 질문의 선택지를 버튼으로 그린다. 같은 질문이면 다시 그리지 않는다(누르던 선택이 사라지지 않게).
const choiceBar = document.getElementById('choiceBar');
const choicesEl = document.getElementById('choices');
const choiceHint = document.getElementById('choiceHint');
let choiceKey = '';
function renderChoices(q) {
  const key = q ? JSON.stringify(q) : '';
  if (key === choiceKey) return;
  choiceKey = key;
  if (key) {
    // 새 질문이 오면 진행바를 1 올린다 (같은 질문 다시 그리기는 위에서 걸러짐)
    questionCount += 1;
    updateProgress();
  }
  choicesEl.innerHTML = '';
  const oldExtra = document.getElementById('choiceExtraWrap');
  if (oldExtra) oldExtra.remove();
  if (!q) { choiceBar.classList.remove('show'); return; }
  const picked = new Set();
  choiceHint.textContent = q.kind === 'multi' ? '해당되는 것을 모두 누른 뒤 "선택 완료"를 눌러 주세요'
    : q.owner_only ? '방장님이 눌러 주세요' : '누르면 바로 답이 전송돼요. 직접 적어도 돼요';
  // 여러 개 고르기용 토글 버튼 만들기 (처음 선택지와 더 보기 펼침이 같은 방식)
  const makeMultiBtn = (opt) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = opt;
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      if (opt === '없음') { choiceBar.classList.remove('show'); sendRoomMessage('없음'); return; }
      if (picked.has(opt)) { picked.delete(opt); b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }
      else { picked.add(opt); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); }
    };
    return b;
  };
  for (const opt of q.options) {
    if (q.kind === 'multi') { choicesEl.appendChild(makeMultiBtn(opt)); continue; }
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = opt;
    b.onclick = () => { choiceBar.classList.remove('show'); sendRoomMessage(opt); };
    choicesEl.appendChild(b);
  }
  if (q.kind === 'multi') {
    // 목록 밖 항목: 처음에는 q.options만 보이고, 더 보기를 누르면 q.more_options를 같은 토글 방식으로 펼친다
    const moreOpts = Array.isArray(q.more_options) ? q.more_options.filter((o) => typeof o === 'string' && o && q.options.indexOf(o) < 0) : [];
    if (moreOpts.length) {
      const moreBtn = document.createElement('button');
      moreBtn.type = 'button';
      moreBtn.textContent = '더 보기';
      moreBtn.setAttribute('aria-label', '선택지 더 보기');
      moreBtn.setAttribute('aria-expanded', 'false');
      moreBtn.onclick = () => {
        for (const opt of moreOpts) choicesEl.appendChild(makeMultiBtn(opt));
        moreBtn.remove();
      };
      choicesEl.appendChild(moreBtn);
    }
    const extraWrap = document.createElement('div');
    extraWrap.id = 'choiceExtraWrap';
    // 작은 화면(360px)에서도 가로로 넘치지 않게 입력칸은 세로로 쌓는다
    extraWrap.style.cssText = 'margin-top:8px;display:flex;flex-direction:column;gap:8px;';
    // 목록에 없는 것 추가 입력칸
    const extraLabel = document.createElement('label');
    extraLabel.setAttribute('for', 'choiceExtra');
    extraLabel.textContent = '+ 목록에 없는 것 추가';
    extraLabel.style.cssText = 'font-size:0.8125rem;color:var(--text-muted);';
    extraWrap.appendChild(extraLabel);
    const extra = document.createElement('input');
    extra.id = 'choiceExtra';
    extra.type = 'text';
    extra.placeholder = '예: 바비큐, 테라스석';
    extra.setAttribute('aria-label', '목록에 없는 항목 추가');
    extra.autocomplete = 'off';
    extra.maxLength = 200;
    extra.style.cssText = 'width:100%;max-width:100%;min-width:0;min-height:44px;padding:0 12px;font-size:0.9375rem;border:1px solid var(--border);border-radius:8px;';
    extraWrap.appendChild(extra);
    // 덧붙일 말 입력칸
    const noteLabel = document.createElement('label');
    noteLabel.setAttribute('for', 'choiceNote');
    noteLabel.textContent = '덧붙일 말';
    noteLabel.style.cssText = 'font-size:0.8125rem;color:var(--text-muted);';
    extraWrap.appendChild(noteLabel);
    const noteInput = document.createElement('input');
    noteInput.id = 'choiceNote';
    noteInput.type = 'text';
    noteInput.placeholder = '예: 소형견만 가능해요';
    noteInput.setAttribute('aria-label', '덧붙일 말');
    noteInput.autocomplete = 'off';
    noteInput.maxLength = 200;
    noteInput.style.cssText = 'width:100%;max-width:100%;min-width:0;min-height:44px;padding:0 12px;font-size:0.9375rem;border:1px solid var(--border);border-radius:8px;';
    extraWrap.appendChild(noteInput);
    choiceBar.appendChild(extraWrap);
    const done = document.createElement('button');
    done.type = 'button';
    done.className = 'done';
    done.textContent = '선택 완료';
    done.style.cssText = 'min-height:44px;border:1px solid var(--border);background:var(--accent-dark);color:#fff;border-radius:999px;padding:0 16px;font-size:0.9375rem;cursor:pointer;white-space:nowrap;';
    const submitMulti = () => {
      // 화면에서 서버로 보내는 여러 개 고르기 답 형식: 고른 항목 + 덧붙일 말 + 목록 밖 추가 항목
      const base = picked.size ? [...picked].join(', ') : '';
      const note = noteInput.value.trim();
      const added = extra.value.split(',').map((s) => s.trim()).filter(Boolean).join(', ');
      let msg = '없음';
      if (base && note && added) msg = base + ' — ' + note + ' / 추가: ' + added;
      else if (base && note) msg = base + ' — ' + note;
      else if (base && added) msg = base + ' / 추가: ' + added;
      else if (base) msg = base;
      else if (note && added) msg = '— ' + note + ' / 추가: ' + added;
      else if (note) msg = '— ' + note;  // 고른 것 없이 덧붙일 말만: 앞의 "—"로 추가 항목과 구분한다
      else if (added) msg = '추가: ' + added;
      choiceBar.classList.remove('show'); sendRoomMessage(msg);
    };
    done.onclick = submitMulti;
    extra.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMulti(); });
    noteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMulti(); });
    extraWrap.appendChild(done);
  } else {
    const direct = document.createElement('button');
    direct.type = 'button';
    direct.textContent = '직접 적기';
    direct.setAttribute('aria-label', '직접 적기');
    direct.onclick = () => {
      const inp = document.getElementById('input');
      if (inp) inp.focus();
    };
    choicesEl.appendChild(direct);
  }
  choiceBar.classList.add('show');
}

function updateActionBars(state, votes) {
  voteBar.classList.toggle('show', state === 'AWAIT_APPROVAL');
  // D52: 공유방은 전원 동의해야 다음 단계. 몇 명이 동의했는지 보여 준다.
  const total = roomMembers.length;
  const agreed = Object.values(votes || {}).filter(v => v === 'approve').length;
  const mine = roomMe && votes ? votes[roomMe.member_handle] : null;
  document.getElementById('voteText').textContent = total > 1
    ? `모두 동의하면 다음 단계로 넘어가요 · 동의 ${agreed}/${total}`
    : '이 요구사항으로 견적을 진행할까요?';
  const yes = document.getElementById('voteYesBtn');
  yes.disabled = mine === 'approve';
  yes.textContent = mine === 'approve' ? '✓ 동의함' : '👍 동의';
  proceedBar.classList.toggle('show', state === 'QUOTED');
}

// 4초 간격 setInterval 폴링과, 메시지 전송 직후 수동 호출(sendRoomMessage → pollMessages)이
// 동시에 겹치면 둘 다 같은 lastSeq 값으로 조회를 시작해 같은 메시지를 중복 렌더링하는
// 경쟁 상태(race condition)가 생긴다 — 실측 재현됨("자신이 보낸 메시지가 자신에게 중복").
// 진행 중인 호출이 있으면 새 호출은 건너뛰어(no-op) 한 번에 하나만 실행되게 한다.
let pollInFlight = false;
async function pollMessages() {
  if (!roomId || pollInFlight) return;
  pollInFlight = true;
  try {
    const res = await fetch(`/room/${roomId}/messages?since=${lastSeq}`, { headers: { 'X-Member-Id': memberId } });
    if (!res.ok) return;
    const data = await res.json();
    const freshBatch = !historyDone;
    for (const m of data.messages) {
      addMessage(m, !freshBatch);
      if (m.kind === 'ai_reply' && findDesignId(m.text)) hasDesign = true;
    }
    if (!historyDone) {
      historyDone = true;
      try { window.__agtHistoryDone = true; } catch (e) { /* 무시 */ }
    }
    if (data.messages.length) lastSeq += data.messages.length;
    updateStatus(data.ai_status);
    renderChoices(data.question || null);
    if (Array.isArray(data.members)) roomMembers = data.members;
    if (data.me) roomMe = data.me;
    updateActionBars(data.state, data.votes);
    document.getElementById('talkModeBar').hidden = roomMembers.length < 2;
    if (roomMembers.length < 2 && !sendToAi) setTalkMode(true);
    if (data.design_url) hasDesign = true;
    memberCountEl.textContent = roomMembers.length ? `${roomMembers.length}명 참여 중` : '';
    memberCountEl.setAttribute('aria-label', roomMembers.length ? `참여자 목록 열기, ${roomMembers.length}명 참여 중` : '참여자 목록 열기');
    renderMembers();
    // 전화로 답하기 버튼(callbot.js)이 참여자·방장·단계를 보고 보이고 숨긴다
    try { window.dispatchEvent(new CustomEvent('agt:room', { detail: { roomId, members: roomMembers, me: roomMe, state: data.state } })); } catch (e) { /* 무시 */ }
    updateShareUI();
    updateOwnerTools();
    // 초대 목록·카톡 상태는 폴링마다 부르지 않고 방장 확인 뒤 한 번만 조회한다.
    if (isOwner() && !invitesUnsupported && !invitesLoaded) {
      invitesLoaded = true;
      refreshInvites();
    }
    if (isOwner() && !notifyUnsupported && !notifyChecked) {
      notifyChecked = true;
      checkNotify();
    }
    // 예약 현재 상태는 들어올 때 한 번만 조회한다. 실패는 조용히 둔다.
    if (!bookingStatesLoaded && isBookingOwner()) {
      bookingStatesLoaded = true;
      refreshBookingStates();
    }
  } finally {
    pollInFlight = false;
  }
}

async function sendRoomMessage(text, toAi = true) {
  // 보내거나 고르는 순간 읽던 소리를 바로 끊는다.
  try { if (typeof window.stopAllSpeech === 'function') window.stopAllSpeech(); } catch (e) { /* 무시 */ }
  try { if (typeof window.cancelHandsfreeListen === 'function') window.cancelHandsfreeListen(); } catch (e) { /* 무시 */ }
  try { if (typeof window.unlockSpeech === 'function') window.unlockSpeech(); } catch (e) { /* 무시 */ }
  // 첫 입장 메시지에만 주소창 invite 값을 함께 보낸다 (계약 §3).
  const body = { member_id: memberId, nickname, message: text };
  if (!toAi) body.to_ai = false;
  if (!inviteAttached && inviteToken) body.invite = inviteToken;
  const res = await fetch(`/room/${roomId}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
    body: JSON.stringify(body),
  });
  inviteAttached = true;
  // 입장·전송 거절은 쉬운 말로 안내한다 (계약 §3).
  if (res.status === 403 || res.status === 423) {
    let detail = '';
    try { detail = (await res.clone().json()).detail || ''; } catch (e) { /* 본문이 없어도 기본 안내로 */ }
    let msg;
    if (res.status === 423 || detail === 'room closed') {
      msg = '방이 닫혔어요. 방장이 메시지를 보내면 다시 열려요.';
    } else if (detail === 'invite required') {
      msg = '초대 링크가 필요해요. 방장에게 초대 링크를 받아 주세요.';
    } else if (detail === 'invite invalid') {
      msg = '초대 링크가 만료됐거나 폐기됐어요. 방장에게 새 링크를 요청해 주세요.';
    } else {
      msg = '방이 꽉 찼어요(최대 10명). 방장에게 문의해 주세요.';
    }
    let note = document.getElementById('roomNotice');
    if (!note) {
      note = document.createElement('p');
      note.id = 'roomNotice';
      note.setAttribute('role', 'status');
      note.style.cssText = 'margin:6px 16px;font-size:0.8125rem;color:var(--text-muted);';
      document.getElementById('row').after(note);
    }
    note.textContent = msg;
    return null;
  }
  await pollMessages();
  return res.ok ? res.json() : null;
}

// D52: 공유방에서 '우리끼리'로 보내면 AI가 읽지 않는다. 선택지·투표 버튼은 늘 AI에게 간다.
let sendToAi = true;
function setTalkMode(toAi) {
  sendToAi = toAi;
  document.getElementById('talkAiBtn').setAttribute('aria-pressed', String(toAi));
  document.getElementById('talkUsBtn').setAttribute('aria-pressed', String(!toAi));
  document.getElementById('input').placeholder = toAi ? '메시지를 입력하세요...' : '우리끼리 이야기 (AI는 읽지 않아요)';
}

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendRoomMessage(text, sendToAi);
}

function vote(choice) { sendRoomMessage(choice); }
function proceed(choice) { sendRoomMessage(choice); }

function shareInviteUrl(absUrl) {
  if (!window.Kakao || !Kakao.isInitialized()) {
    // 초대 대화상자가 열려 있으면 그 안 안내에, 아니면 입력창 아래 안내에 남긴다.
    const box = document.getElementById('inviteDialogWrap');
    const inline = document.getElementById('inviteMsg');
    if (inline && box && !box.hidden) {
      inline.textContent = '카카오 SDK 로딩에 실패했어요. 링크를 복사해 공유해 주세요.';
      return;
    }
    let note = document.getElementById('roomNotice');
    if (!note) {
      note = document.createElement('p');
      note.id = 'roomNotice';
      note.setAttribute('role', 'status');
      note.style.cssText = 'margin:6px 16px;font-size:0.8125rem;color:var(--text-muted);';
      document.getElementById('row').after(note);
    }
    note.textContent = '카카오 SDK 로딩에 실패했어요. 방 주소를 복사해 공유해 주세요.';

      link: { mobileWebUrl: absUrl, webUrl: absUrl },
    },
    buttons: [{ title: '방 입장하기', link: { mobileWebUrl: absUrl, webUrl: absUrl } }],
  });
}

async function shareInvite() {
  // 방장은 방 주소 대신 초대 링크를 새로 발급해 공유한다 (계약 §3). 없으면(404) 예전처럼 방 주소 공유.
  if (isOwner() && !invitesUnsupported) {
    try {
      const res = await fetch(`/room/${roomId}/invites`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
        body: JSON.stringify({ days: 7 }),
      });
      if (res.status === 404) { invitesUnsupported = true; updateShareUI(); }
      else if (res.ok) {
        const data = await res.json();
        const absUrl = new URL(data.url, location.href).href;
        refreshInvites();
        shareInviteUrl(absUrl);
        return;
      }
    } catch (e) { /* 네트워크 실패면 아래 예전 방식으로 */ }
  }
  const url = new URL(location.href);
  url.search = `?room=${roomId}`;
  shareInviteUrl(url.href);
}

// 내가 방장인지 (계약 §1 me. 서버가 아직 안 주면 방장 기능을 숨긴다).
function isOwner() {
  return !!(roomMe && roomMe.is_owner);
}

// 참여자 목록 그리기. 서버·사용자 글은 textContent로만 넣는다.
function renderMembers() {
  const list = document.getElementById('memberList');
  if (!list) return;
  list.replaceChildren();
  const title = document.getElementById('memberPanelTitle');
  if (title) title.textContent = roomMembers.length ? `참여자 ${roomMembers.length}명` : '참여자';
  for (let i = 0; i < roomMembers.length; i++) {
    const m = roomMembers[i];
    const li = document.createElement('li');
    const nick = document.createElement('span');
    nick.className = 'nick';
    nick.textContent = m.nickname || '익명';
    li.appendChild(nick);
    // 서버가 is_owner를 아직 안 주면 가장 먼저 들어온 사람이 방장이다.
    const owner = typeof m.is_owner === 'boolean' ? m.is_owner : i === 0;
    if (owner) {
      const badge = document.createElement('span');
      badge.className = 'owner-badge';
      badge.textContent = '방장';
      badge.style.cssText = 'font-size:0.6875rem;background:var(--accent-dark);color:#fff;padding:2px 8px;border-radius:999px;';
      li.appendChild(badge);
    }
    // 내가 방장이면 다른 참여자에게 방장을 넘길 수 있다.
    if (isOwner() && !ownerApiUnsupported && m.member_handle && (!roomMe || m.member_handle !== roomMe.member_handle)) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'transferBtn';
      btn.textContent = '방장 넘기기';
      btn.setAttribute('aria-label', (m.nickname || '익명') + '에게 방장 넘기기');
      btn.onclick = () => openOwnerDialog(m);
      li.appendChild(btn);
    }
    list.appendChild(li);
  }
  const leaveBtn = document.getElementById('leaveBtn');
  if (leaveBtn) leaveBtn.hidden = leaveUnsupported;
  const moreLeaveBtn = document.getElementById('moreLeaveBtn');
  if (moreLeaveBtn) moreLeaveBtn.hidden = leaveUnsupported;
}

function openMemberPanel() {
  const wrap = document.getElementById('memberPanelWrap');
  if (!wrap) return;
  renderMembers();
  wrap.hidden = false;
  memberCountEl.setAttribute('aria-expanded', 'true');
  const closeBtn = document.getElementById('memberPanelClose');
  if (closeBtn) closeBtn.focus();
}

function closeMemberPanel() {
  const wrap = document.getElementById('memberPanelWrap');
  if (!wrap) return;
  wrap.hidden = true;
  memberCountEl.setAttribute('aria-expanded', 'false');
  memberCountEl.focus();
}

// 화면 안 대화상자로 방장 넘기기 확인 (window.confirm 대신).
let ownerTransferTarget = null;
let ownerTransferReturnFocus = null;
function openOwnerDialog(m) {
  ownerTransferTarget = m;
  ownerTransferReturnFocus = document.activeElement;
  const wrap = document.getElementById('ownerDialogWrap');
  const text = document.getElementById('ownerDialogText');
  if (!wrap || !text) return;
  text.textContent = (m.nickname || '익명') + '님에게 방장을 넘길까요? 넘기면 초대·폐기는 새 방장이 맡아요.';
  wrap.hidden = false;
  document.getElementById('ownerConfirmBtn').focus();
}

function closeOwnerDialog() {
  const wrap = document.getElementById('ownerDialogWrap');
  if (wrap) wrap.hidden = true;
  ownerTransferTarget = null;
  if (ownerTransferReturnFocus && ownerTransferReturnFocus.focus) ownerTransferReturnFocus.focus();
}

async function confirmOwnerTransfer() {
  if (!ownerTransferTarget) { closeOwnerDialog(); return; }
  try {
    const res = await fetch(`/room/${roomId}/owner`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
      body: JSON.stringify({ to: ownerTransferTarget.member_handle }),
    });
    if (res.status === 404) {
      ownerApiUnsupported = true;
      closeOwnerDialog();
      renderMembers();
      return;
    }
    if (res.status === 403) {
      const text = document.getElementById('ownerDialogText');
      if (text) text.textContent = '방장만 넘길 수 있어요.';
      return;
    }
    if (!res.ok) {
      const text = document.getElementById('ownerDialogText');
      if (text) text.textContent = '지금은 넘길 수 없어요. 잠시 뒤에 다시 시도해 주세요.';
      return;
    }
    closeOwnerDialog();
    await pollMessages();
  } catch (e) {
    const text = document.getElementById('ownerDialogText');
    if (text) text.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.';
  }
}

async function leaveRoom() {
  try {
    const res = await fetch(`/room/${roomId}/leave`, {
      method: 'POST',
      headers: { 'X-Member-Id': memberId },
    });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 버튼을 숨긴다.
      leaveUnsupported = true;
      renderMembers();
      return;
    }
    if (!res.ok) return;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    const wrap = document.getElementById('memberPanelWrap');
    if (wrap) wrap.hidden = true;
    let note = document.getElementById('roomNotice');
    if (!note) {
      note = document.createElement('p');
      note.id = 'roomNotice';
      note.setAttribute('role', 'status');
      note.style.cssText = 'margin:6px 16px;font-size:0.8125rem;color:var(--text-muted);';
      document.getElementById('row').after(note);
    }
    note.textContent = '방에서 나갔어요.';
  } catch (e) { /* 네트워크 실패면 그대로 둔다 */ }
}

// 초대 도구막대 보이기·숨기기. 방장이 아니면 초대 버튼 대신 더보기 안 안내만 보여준다.
function updateShareUI() {
  const owner = isOwner();
  const openBtn = document.getElementById('inviteOpenBtn');
  const notice = document.getElementById('inviteNotice');
  if (!openBtn || !notice) return;
  if (!roomMe) {
    openBtn.hidden = false;
    notice.hidden = true;
    return;
  }
  if (owner) {
    openBtn.hidden = false;
    notice.hidden = true;
  } else {
    openBtn.hidden = true;
    notice.hidden = false;
  }
}

function inviteExpiryText(inv) {
  if (!inv.expires_at) return '무기한';
  const d = new Date(inv.expires_at);
  if (isNaN(d.getTime())) return '기간 있음';
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일까지';
}

async function refreshInvites() {
  if (!isOwner() || invitesUnsupported) return;
  const list = document.getElementById('inviteList');
  if (!list) return;
  try {
    const res = await fetch(`/room/${roomId}/invites`, { headers: { 'X-Member-Id': memberId } });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 숨긴다.
      invitesUnsupported = true;
      updateShareUI();
      return;
    }
    if (!res.ok) return;
    const data = await res.json();
    list.replaceChildren();
    for (const inv of data.invites || []) {
      if (inv.revoked) continue;
      const li = document.createElement('li');
      const info = document.createElement('span');
      info.className = 'info';
      const uses = typeof inv.uses === 'number' ? ' · ' + inv.uses + '명 입장' : '';
      info.textContent = inviteExpiryText(inv) + uses;
      li.appendChild(info);
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.textContent = '복사';
      copyBtn.setAttribute('aria-label', '초대 링크 복사');
      copyBtn.onclick = () => copyInviteLink(inv);
      li.appendChild(copyBtn);
      const shareBtn = document.createElement('button');
      shareBtn.type = 'button';
      shareBtn.textContent = '카톡 공유';
      shareBtn.setAttribute('aria-label', '초대 링크 카톡 공유');
      shareBtn.onclick = () => shareInviteLink(inv);
      li.appendChild(shareBtn);
      const revokeBtn = document.createElement('button');
      revokeBtn.type = 'button';
      revokeBtn.textContent = '폐기';
      revokeBtn.setAttribute('aria-label', '초대 링크 폐기');
      revokeBtn.onclick = () => revokeInvite(inv.invite_id);
      li.appendChild(revokeBtn);
      list.appendChild(li);
    }
  } catch (e) { /* 네트워크 실패면 그대로 둔다 */ }
}

// 목록에는 토큰 원문이 없어 방금 발급한 링크만 바로 공유·복사한다.
let lastIssuedInviteUrl = '';
async function createInvite() {
  const msg = document.getElementById('inviteMsg');
  const daysEl = document.getElementById('inviteDays');
  const days = daysEl ? Number(daysEl.value) : 7;
  try {
    const res = await fetch(`/room/${roomId}/invites`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
      body: JSON.stringify({ days }),
    });
    if (res.status === 404) {
      invitesUnsupported = true;
      updateShareUI();
      return;
    }
    if (!res.ok) {
      if (msg) msg.textContent = '지금은 초대 링크를 만들 수 없어요. 잠시 뒤에 다시 시도해 주세요.';
      return;
    }
    const data = await res.json();
    lastIssuedInviteUrl = new URL(data.url, location.href).href;
    if (msg) msg.textContent = '초대 링크를 만들었어요. 복사하거나 카톡으로 공유해 주세요.';
    try {
      await navigator.clipboard.writeText(lastIssuedInviteUrl);
      if (msg) msg.textContent = '초대 링크를 복사했어요. 카톡으로 공유해 주세요.';
    } catch (e) { /* 클립보드 실패면 안내만 둔다 */ }
    shareInviteUrl(lastIssuedInviteUrl);
    refreshInvites();
  } catch (e) {
    if (msg) msg.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.';
  }
}

async function copyInviteLink(inv) {
  const msg = document.getElementById('inviteMsg');
  // 목록 조회에는 주소가 없으므로 방금 발급한 링크만 복사한다.
  if (!lastIssuedInviteUrl) {
    if (msg) msg.textContent = '방금 발급한 링크만 복사할 수 있어요. 초대하기를 눌러 새로 발급해 주세요.';
    return;
  }
  try {
    await navigator.clipboard.writeText(lastIssuedInviteUrl);
    if (msg) msg.textContent = '초대 링크를 복사했어요.';
  } catch (e) {
    if (msg) msg.textContent = '복사에 실패했어요. 초대하기를 눌러 새 링크로 공유해 주세요.';
  }
}

function shareInviteLink(inv) {
  if (!lastIssuedInviteUrl) {
    const msg = document.getElementById('inviteMsg');
    if (msg) msg.textContent = '방금 발급한 링크만 공유할 수 있어요. 초대하기를 눌러 새로 발급해 주세요.';
    return;
  }
  shareInviteUrl(lastIssuedInviteUrl);
}

async function revokeInvite(inviteId) {
  const msg = document.getElementById('inviteMsg');
  try {
    const res = await fetch(`/room/${roomId}/invites/${inviteId}`, {
      method: 'DELETE',
      headers: { 'X-Member-Id': memberId },
    });
    if (res.status === 404) {
      invitesUnsupported = true;
      updateShareUI();
      return;
    }
    if (!res.ok) {
      if (msg) msg.textContent = '지금은 폐기할 수 없어요. 잠시 뒤에 다시 시도해 주세요.';
      return;
    }
    if (msg) msg.textContent = '초대 링크를 폐기했어요.';
    refreshInvites();
  } catch (e) {
    if (msg) msg.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.';
  }
}

// 사진 올리기 (계약 §4). 성공하면 폴링으로 photo 메시지가 보인다.
const PHOTO_MAX_BYTES = 10 * 1024 * 1024;
function setPhotoStatus(text) {
  const el = document.getElementById('photoStatus');
  if (!el) return;
  el.textContent = text || '';
  el.classList.toggle('show', !!text);
}

async function uploadPhoto(file) {
  const btn = document.getElementById('photoBtn');
  if (!file) return;
  if (file.size > PHOTO_MAX_BYTES) {
    setPhotoStatus('사진이 너무 커요. 10MB 이하로 올려 주세요.');
    return;
  }
  setPhotoStatus('사진을 올리는 중…');
  if (btn) btn.disabled = true;
  try {
    const form = new FormData();
    form.append('file', file);
    const res = await fetch(`/room/${roomId}/photos`, {
      method: 'POST',
      headers: { 'X-Member-Id': memberId },
      body: form,
    });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 버튼을 숨긴다.
      if (btn) btn.style.display = 'none';
      setPhotoStatus('');
      return;
    }
    if (res.status === 413) {
      setPhotoStatus('사진이 너무 커요. 10MB 이하로 올려 주세요.');
      return;
    }
    if (!res.ok) {
      setPhotoStatus('지금은 사진을 올릴 수 없어요. 잠시 뒤에 다시 시도해 주세요.');
      return;
    }
    setPhotoStatus('');
    await pollMessages();
  } catch (e) {
    setPhotoStatus('인터넷 연결을 확인하고 다시 시도해 주세요.');
  } finally {
    if (btn) btn.disabled = false;
    const input = document.getElementById('photoInput');
    if (input) input.value = '';
  }
}

// 방장 도구: 더보기 안에서 카톡 알림·직접 고치기·나가기 (계약 §5·§6). 방장에게만 보인다.
function updateOwnerTools() {
  const talkBtn = document.getElementById('talkNotifyBtn');
  const editor = document.getElementById('editorLink');
  const moreLeave = document.getElementById('moreLeaveBtn');
  if (!talkBtn || !editor) return;
  if (!isOwner()) {
    talkBtn.hidden = true;
    editor.hidden = true;
    if (moreLeave) moreLeave.hidden = !!leaveUnsupported;
    return;
  }
  talkBtn.hidden = !!notifyUnsupported;
  if (hasDesign) {
    editor.hidden = false;
    editor.href = '/editor?room=' + encodeURIComponent(roomId);
  } else {
    editor.hidden = true;
  }
  if (moreLeave) moreLeave.hidden = !!leaveUnsupported;
}

async function checkNotify() {
  const talkBtn = document.getElementById('talkNotifyBtn');
  if (!talkBtn) return;
  try {
    const res = await fetch(`/api/rooms/${roomId}/notify`, { headers: { 'X-Member-Id': memberId } });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 숨긴다.
      notifyUnsupported = true;
      talkBtn.hidden = true;
      updateOwnerTools();
      return;
    }
    if (!res.ok) return;
    const data = await res.json();
    const on = !!(data && data.kakao && data.kakao.owner_linked);
    // P1: 실제 수신 실측 전이라 '테스트 중'을 함께 밝힌다 (허위 신뢰 방지)
    talkBtn.textContent = on ? '카톡 알림 켜짐' : '문의를 카톡으로 받기 (테스트 중)';
    talkBtn.disabled = on;
  } catch (e) { /* 네트워크 실패면 그대로 둔다 */ }
}

function startTalkNotify() {
  const next = '/room.html?room=' + encodeURIComponent(roomId);
  location.href = '/auth/kakao/start?talk=1&next=' + encodeURIComponent(next);
}

// 카카오 로그인에서 돌아왔을 때 방을 계정에 한 번만 옮긴다 (계약 §6).
async function claimRoomOnce() {
  if (claimTried || !roomId || !memberId) return;
  claimTried = true;
  let key = '';
  try { key = 'agt001_claimed_' + roomId; } catch (e) { return; }
  try {
    if (sessionStorage.getItem(key)) return;
  } catch (e) { /* 저장소를 못 쓰면 한 번만 시도하고 끝낸다 */ }
  let me = null;
  try {
    const res = await fetch('/api/me', { credentials: 'same-origin' });
    if (res.status === 404) return;
    if (!res.ok) return;
    me = await res.json();
  } catch (e) { return; }
  if (!me || !me.user) return;
  try {
    await fetch('/api/me/claim', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
      body: JSON.stringify({ room_ids: [roomId] }),
    });
  } catch (e) { /* 실패해도 방 사용은 계속된다 */ }
  try { sessionStorage.setItem(key, '1'); } catch (e) { /* 무시 */ }
}

async function ensureRoom() {
  if (roomId) return;
  const res = await fetch('/room', { method: 'POST' });
  const data = await res.json();
  roomId = data.room_id;
  const url = new URL(location.href);
  url.searchParams.set('room', roomId);
  history.replaceState(null, '', url);
}

function joinRoom() {
  const input = document.getElementById('nicknameInput');
  const value = input.value.trim();
  if (!value) { input.focus(); return; }
  nickname = value;
  safeSet('agt001_nickname', nickname);
  document.getElementById('nicknameOverlay').remove();
  startRoom();
}

// 이 기기에서 들어간 방을 기억한다("내 프로젝트" 화면이 읽는다, /projects). 최근 50개까지.
function rememberRoom(id) {
  try {
    const list = JSON.parse(localStorage.getItem('agt001_rooms') || '[]').filter((r) => r !== id);
    list.unshift(id);
    localStorage.setItem('agt001_rooms', JSON.stringify(list.slice(0, 50)));
  } catch (e) { /* 저장소를 못 쓰면 목록만 비어 있다 */ }
}

async function startRoom() {
  await ensureRoom();
  if (!memberId) {
    memberId = makeMemberId();
    safeSet('agt001_member_id', memberId);
  }
  // 온보딩 안내: 서버에 남기지 않는 프론트 1회성 표시. 정말 새 방일 때만 보여준다.
  // 참여자가 아니면 기록을 조회할 수 없으므로(ROOM_POLICY.md R-0), 새 방인지는
  // 입장 응답의 fresh(입장 전 메시지가 하나도 없었는지)로 판단한다.
  rememberRoom(roomId);
  const joined = await sendRoomMessage('');
  claimRoomOnce();
  if (pending) {
    // 랜딩에서 적은 내용을 첫 메시지로 보낸다. 사용자가 이미 설명했으므로 안내 메시지는 생략한다.
    await sendRoomMessage(pending.text);
  } else if (joined && joined.fresh) {
    showOnboarding();
  }
  pollTimer = setInterval(pollMessages, 4000);
}

// 새 방 첫 입장 시 1회만 보여주는 온보딩 안내.
// kind=ai_reply로 렌더링해서 AI가 직접 소개하는 느낌으로 보여준다.
// 서버 messages 배열에는 저장하지 않는다(프론트 표시 전용이므로 seq/lastSeq와
// 무관하고, 이후 폴링·투표·진행 등 기존 기능에 영향을 주지 않는다).
const ONBOARDING_TEXT =
  '안녕하세요! 저는 웹사이트 제작을 돕는 AI 어시스턴트입니다. 🤖\n\n' +
  '원하는 걸 편하게 말씀해 보세요. 함께 요구사항을 정리하고, 견적을 내고, ' +
  '실제로 열리는 시안 페이지와 코드까지 만들어 드립니다.\n\n' +
  '예를 들면 이런 것들이에요:\n' +
  '• 카페/스터디카페 예약 페이지 (날짜·시간 예약, 메뉴 소개)\n' +
  '• 회사·가게 소개 랜딩페이지\n' +
  '• 상품 소개 + 문의 폼 페이지\n\n' +
  '먼저 만들고 싶은 것을 한 문장으로 적어주세요. (예: "카페 예약 웹사이트 만들고 싶어요")';

function showOnboarding() {
  addMessage({ kind: 'ai_reply', nickname: 'AI 어시스턴트', text: ONBOARDING_TEXT });
}

document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// 입력줄 아래 1줄 정리: 초대 대화상자·더보기 펼침 (window.confirm/alert 사용 금지).
let inviteReturnFocus = null;
let moreReturnFocus = null;
function focusablesIn(root) {
  if (!root) return [];
  const els = root.querySelectorAll('button, a[href], select, input');
  const out = [];
  for (const el of els) {
    if (el.hidden || el.disabled) continue;
    try {
      if (el.getClientRects && el.getClientRects().length === 0) continue;
    } catch (e) { /* 보이면 둔다 */ }
    out.push(el);
  }
  return out;
}
function trapTab(e, root) {
  if (!e || e.key !== 'Tab' || !root || root.hidden) return;
  const f = focusablesIn(root);
  if (!f.length) return;
  const first = f[0];
  const last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function openInviteDialog() {
  if (invitesUnsupported) { shareInvite(); return; }
  inviteReturnFocus = document.activeElement;
  const wrap = document.getElementById('inviteDialogWrap');
  if (!wrap) return;
  wrap.hidden = false;
  refreshInvites();
  const sel = document.getElementById('inviteDays');
  const closeBtn = document.getElementById('inviteDialogClose');
  const target = sel || closeBtn;
  if (target) target.focus();
}
function closeInviteDialog() {
  const wrap = document.getElementById('inviteDialogWrap');
  if (wrap) wrap.hidden = true;
  if (inviteReturnFocus && inviteReturnFocus.focus) inviteReturnFocus.focus();
}
function openMoreSheet() {
  moreReturnFocus = document.activeElement;
  const wrap = document.getElementById('moreSheetWrap');
  if (!wrap) return;
  relocateWalkie();
  updateOwnerTools();
  updateShareUI();
  wrap.hidden = false;
  const btn = document.getElementById('moreBtn');
  if (btn) btn.setAttribute('aria-expanded', 'true');
  const sheet = document.getElementById('moreSheet');
  const f = focusablesIn(sheet);
  if (f.length) f[0].focus();
  else {
    const closeBtn = document.getElementById('moreCloseBtn');
    if (closeBtn) closeBtn.focus();
  }
}
function closeMoreSheet() {
  const wrap = document.getElementById('moreSheetWrap');
  if (wrap) wrap.hidden = true;
  const btn = document.getElementById('moreBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  if (moreReturnFocus && moreReturnFocus.focus) moreReturnFocus.focus();
}
// voice.js가 입력줄 위에 만드는 무전기·읽어주기 스위치를 더보기 안으로 옮긴다 (fetch 변경 없음).
function relocateWalkie() {
  try {
    const row = document.getElementById('walkieRow');
    if (row) row.style.display = 'none';
    const sw = document.getElementById('walkieSwitch');
    const slot = document.getElementById('walkieSlot');
    if (sw && slot && sw.parentNode !== slot) slot.appendChild(sw);
    const ar = document.getElementById('autoreadSwitch');
    if (ar && slot && ar.parentNode !== slot) slot.appendChild(ar);
    const hf = document.getElementById('handsfreeSwitch');
    if (hf && slot && hf.parentNode !== slot) slot.appendChild(hf);
  } catch (e) { /* 스위치 이동 실패해도 입력은 유지 */ }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', relocateWalkie);
window.addEventListener('load', relocateWalkie);
try {
  const walkieObs = new MutationObserver(() => relocateWalkie());
  walkieObs.observe(document.documentElement, { childList: true, subtree: true });
  setTimeout(relocateWalkie, 500);
  setTimeout(relocateWalkie, 1500);
} catch (e) { /* 관찰자 실패해도 계속 진행 */ }

// 참여자 패널·초대·사진·방장 도구 연결
memberCountEl.addEventListener('click', () => {

});

});

  const moreWrap = document.getElementById('moreSheetWrap');

});

document.getElementById('inviteOpenBtn').addEventListener('click', openInviteDialog);
document.getElementById('inviteDialogClose').addEventListener('click', closeInviteDialog);
document.getElementById('inviteDialogWrap').addEventListener('click', (e) => {

});
document.getElementById('inviteDialogWrap').addEventListener('keydown', (e) => {

});

  const wrap = document.getElementById('moreSheetWrap');

});
// P0: 시안 바텀시트 닫기 연결 (기존 대화상자들과 같은 규칙: 바깥 누름·Esc·탭 가두기·포커스 복귀)

document.getElementById('designSheetWrap').addEventListener('keydown', (e) => {

  trapTab(e, wrap);
});

});

});

// 랜딩(frontend/src/api.ts)에서 넘어온 첫 메시지. 이 방의 것일 때만 한 번 쓰고 지운다.
let pending = null;
try {
  const raw = sessionStorage.getItem('agt001_pending_message');
  if (raw) {
    const p = JSON.parse(raw);
    if (p && p.roomId === roomId && typeof p.text === 'string') pending = p;
    sessionStorage.removeItem('agt001_pending_message');
  }
} catch (e) { /* 저장소를 못 쓰면 평소처럼 시작 */ }
// 랜딩에서 바로 온 사람은 닉네임 입력 없이 시작한다(저장하지 않아 다른 방에는 영향 없음).
if (!nickname && pending) nickname = '사장님';

if (nickname) {
  document.getElementById('nicknameOverlay').remove();
  startRoom();
}
// nickname 없을 때는 #nicknameJoinBtn의 inline onclick="joinRoom()"이 처리한다 (중복 리스너 금지).
