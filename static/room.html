  #ownerDialogBtns { display: flex; gap: 8px; }

  #ownerConfirmBtn { border: 1px solid var(--accent-dark); background: var(--accent-dark); color: #fff; }

    position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px;

    background: var(--surface); border-radius: 12px; padding: 24px; max-width: 320px; width: 100%;
  }
  #nicknameCard h2 { margin: 0 0 8px; font-size: 1.125rem; }
  #nicknameCard p { margin: 0 0 16px; font-size: 0.875rem; color: var(--text-muted); }

<script>
const KAKAO_JS_KEY = 'db5e5247ff48a792df0cc393b4453c6d';
if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);

const log = document.getElementById('log');
const statusBar = document.getElementById('statusBar');
const statusText = document.getElementById('statusText');
const voteBar = document.getElementById('voteBar');
const proceedBar = document.getElementById('proceedBar');
const memberCountEl = document.getElementById('memberCount');

// 일부 환경(카카오톡 인앱 브라우저의 data: URL 렌더링 등)에서는 localStorage 접근 자체가
// SecurityError를 던진다. 이게 최상위에서 잡히지 않으면 스크립트 전체가 죽어서 이후
// 모든 버튼이 먹통이 된다 — 반드시 try/catch로 감싸고, 실패하면 메모리로만 동작(새로고침 시
// 닉네임 재입력)하게 degrade한다.
function safeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage 사용 불가 — 무시하고 계속 진행 */ }
}

// crypto.randomUUID()는 "secure context"(HTTPS/localhost)에서만 지원된다.
// OCI 배포본은 평문 HTTP(http://144.24.91.250:8643)라서 이 함수 자체가 없을 수 있다 —
// 없으면 폴백으로 직접 UUID v4 형태 문자열을 만든다 (암호학적으로 엄밀하지 않아도 충분 —
// 방 참여자 구분용 ID일 뿐이다).
function makeMemberId() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

let roomId = new URLSearchParams(location.search).get('room');
let memberId = safeGet('agt001_member_id');
let nickname = safeGet('agt001_nickname');
let lastSeq = 0;
let pollTimer = null;
// 초대 토큰은 주소창 invite 값으로 들어오고 첫 입장 메시지에 한 번만 붙인다.
let inviteToken = new URLSearchParams(location.search).get('invite') || '';
let inviteAttached = false;
// 방 조회에서 받은 참여자·내 정보·시안 여부 (계약 §1, 서버가 아직 안 주면 빈 값으로 둔다).
let roomMembers = [];
let roomMe = null;
let hasDesign = false;
let invitesUnsupported = false;
let ownerApiUnsupported = false;
let leaveUnsupported = false;
let notifyUnsupported = false;
let invitesLoaded = false;
let notifyChecked = false;
let claimTried = false;

const STATUS_LABEL = {
  IDLE: '', RAG_SEARCHING: '🔍 과거 프로젝트를 검색 중...', THINKING: '🤖 AI가 생각 중...',
  QUOTING: '🧾 견적을 계산 중...', GENERATING: '⚙️ 코드 생성 중... (최대 90초)', DONE: '✅ 완료',
};

function hueFromString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

  // 시안 3안 이름
  const DESIGN_NAMES = { 1: '기본형', 2: '사진 강조형', 3: '간결형' };
  let pickedDesignNo = 0;
  // 시안 안내 글에서 /design/<id> 찾기
  function findDesignId(t) {
    const s = t || '';
    if (s.indexOf('1안 기본형 · 2안 사진 강조형 · 3안 간결형') < 0) return null;
    const mm = /\/design\/([A-Za-z0-9-]+)(?![\/\w])/.exec(s);
    return mm ? mm[1] : null;
  }
  // 사용자가 보낸 "N안으로 할게요" 찾기
  function findPickedNo(t) {
    const mm = /([123])안으로 할게요/.exec(t || '');
    return mm ? Number(mm[1]) : 0;
  }
  // AI 확정 답장 "N안(이름)으로 정했어요" 찾기
  function findConfirmedNo(t) {
    const mm = /([123])안\(.*?\)으로 정했어요/.exec(t || '');
    return mm ? Number(mm[1]) : 0;
  }
  // 카드 선택 표시 갱신
  function refreshDesignMarks() {
    const cards = document.querySelectorAll('.design-card');
    for (const c of cards) {
      const n = Number(c.getAttribute('data-pick'));
      const on = n === pickedDesignNo;
      c.classList.toggle('on', on);
      const btn = c.querySelector('.design-pick-btn');
      if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  // 시안 카드 3개 묶음 만들기
  function buildDesignCards(bubble, id) {
    const wrap = document.createElement('div');
    wrap.className = 'design-pick';
    for (let n = 1; n <= 3; n++) {
      const card = document.createElement('div');
      card.className = 'design-card';
      card.setAttribute('data-pick', String(n));
      if (n === pickedDesignNo) card.classList.add('on');
      const thumb = document.createElement('div');
      thumb.className = 'design-thumb';
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = n + '안 ' + DESIGN_NAMES[n] + ' 미리보기';
      img.src = '/design/' + id + '/v' + n + '.png';
      img.onerror = () => {
        thumb.textContent = '';
        const fb = document.createElement('div');
        fb.className = 'design-fallback';
        fb.textContent = '미리보기 준비 중';
        thumb.appendChild(fb);
      };
      thumb.appendChild(img);
      card.appendChild(thumb);
      const title = document.createElement('div');
      title.className = 'design-title';
      title.textContent = n + '안 · ' + DESIGN_NAMES[n];
      const badge = document.createElement('span');
      badge.className = 'design-badge';
      badge.textContent = '선택됨';
      title.appendChild(badge);
      card.appendChild(title);
      const row = document.createElement('div');
      row.className = 'design-row';
      const pick = document.createElement('button');
      pick.type = 'button';
      pick.className = 'design-pick-btn';
      pick.textContent = '이걸로 할게요';
      pick.setAttribute('aria-label', n + '안 ' + DESIGN_NAMES[n] + '으로 할게요');
      pick.setAttribute('aria-pressed', n === pickedDesignNo ? 'true' : 'false');
      pick.onclick = () => {
        sendRoomMessage(n + '안으로 할게요');
        pickedDesignNo = n;
        refreshDesignMarks();
      };
      row.appendChild(pick);
      const open = document.createElement('a');
      open.className = 'design-open';
      open.textContent = '크게 보기';
      open.href = '/design/' + id + '/v' + n + '/';
      open.target = '_blank';
      open.rel = 'noopener';
      row.appendChild(open);
      card.appendChild(row);
      wrap.appendChild(card);
    }
    bubble.appendChild(wrap);
  }

function addMessage(m) {
  const row = document.createElement('div');
  row.className = 'row kind-' + m.kind;
  const safeName = (m.nickname || '').slice(0, 40);
  if (m.kind === 'chat' || m.kind === 'ai_reply' || m.kind === 'photo') {
    const av = document.createElement('div');
    av.className = 'avatar';
    if (m.kind === 'ai_reply') {
      av.textContent = '🤖';
    } else {
      av.textContent = safeName.slice(0, 1);
      av.style.background = `hsl(${hueFromString(safeName || '?')}, 55%, 45%)`;
    }
    row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (m.kind === 'chat' || m.kind === 'ai_reply' || m.kind === 'photo') {
    const meta = document.createElement('div');
    meta.className = 'meta';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = safeName;
    meta.appendChild(nameSpan);
    if (m.kind === 'ai_reply') {
      const badge = document.createElement('span');
      badge.className = 'badge-bot';
      badge.textContent = 'BOT';
      meta.appendChild(badge);
    }
    bubble.appendChild(meta);
  }
  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = m.text || '';
  bubble.appendChild(text);
  // 사진 메시지는 썸네일로 보여주고 누르면 생성물 주소로 연다.
  if (m.kind === 'photo' && m.photo && m.photo.url) {
    const link = document.createElement('a');
    link.className = 'photo-thumb';
    link.href = m.photo.url;
    link.target = '_blank';
    link.rel = 'noopener';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '올린 사진';
    img.src = m.photo.url;
    link.appendChild(img);
    bubble.appendChild(link);
  }
  // AI 답장 말풍선에만 작은 "듣기" 버튼을 단다. 재생은 voice.js의 window.speakAiText가 맡는다.
  if (m.kind === 'ai_reply') {
    const listenBtn = document.createElement('button');
    listenBtn.type = 'button';
    listenBtn.textContent = '듣기';
    listenBtn.setAttribute('aria-label', '답장 듣기');
    listenBtn.style.cssText = 'margin-top:8px;font-size:0.75rem;padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--text);cursor:pointer;';
    listenBtn.onclick = () => {
      if (typeof window.speakAiText === 'function') window.speakAiText(m.text, listenBtn);
    };
    bubble.appendChild(listenBtn);
    if (typeof window.queueWalkieTts === 'function') {
      try { window.queueWalkieTts(m.text); } catch (e) { /* 자동 읽기는 실패해도 말풍선 유지 */ }
    }
  }
  // 시안 고르기: 선택 번호를 기억하고 AI 안내 글 아래에 카드 3개를 단다
  const sayNo = findPickedNo(m.text);
  if (sayNo) pickedDesignNo = sayNo;
  const fixNo = findConfirmedNo(m.text);
  if (fixNo) pickedDesignNo = fixNo;
  if (m.kind === 'ai_reply') {
    const did = findDesignId(m.text);
    if (did) buildDesignCards(bubble, did);
  }
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  if (pickedDesignNo) refreshDesignMarks();
}

function updateStatus(aiStatus) {
  const label = STATUS_LABEL[aiStatus] || '';
  if (label && aiStatus !== 'DONE' && aiStatus !== 'IDLE') {
    statusText.textContent = label;
    statusBar.classList.add('show');
  } else {
    statusBar.classList.remove('show');
  }
}

// 요구사항 질문의 선택지를 버튼으로 그린다. 같은 질문이면 다시 그리지 않는다(누르던 선택이 사라지지 않게).
const choiceBar = document.getElementById('choiceBar');
const choicesEl = document.getElementById('choices');
const choiceHint = document.getElementById('choiceHint');
let choiceKey = '';
function renderChoices(q) {
  const key = q ? JSON.stringify(q) : '';
  if (key === choiceKey) return;
  choiceKey = key;
  choicesEl.innerHTML = '';
  const oldExtra = document.getElementById('choiceExtraWrap');
  if (oldExtra) oldExtra.remove();
  if (!q) { choiceBar.classList.remove('show'); return; }
  const picked = new Set();
  choiceHint.textContent = q.kind === 'multi' ? '해당되는 것을 모두 누른 뒤 "선택 완료"를 눌러 주세요'
    : q.owner_only ? '방장님이 눌러 주세요' : '누르면 바로 답이 전송돼요. 직접 적어도 돼요';
  for (const opt of q.options) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = opt;
    if (q.kind === 'multi') {
      b.setAttribute('aria-pressed', 'false');
      b.onclick = () => {
        if (opt === '없음') { choiceBar.classList.remove('show'); sendRoomMessage('없음'); return; }
        if (picked.has(opt)) { picked.delete(opt); b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }
        else { picked.add(opt); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); }
      };
    } else {
      b.onclick = () => { choiceBar.classList.remove('show'); sendRoomMessage(opt); };
    }
    choicesEl.appendChild(b);
  }
  if (q.kind === 'multi') {
    const extraWrap = document.createElement('div');
    extraWrap.id = 'choiceExtraWrap';
    extraWrap.style.cssText = 'margin-top:8px;display:flex;gap:8px;';
    const extra = document.createElement('input');
    extra.id = 'choiceExtra';
    extra.type = 'text';
    extra.placeholder = '예: 소형견만 가능해요, 주차는 2대';
    extra.setAttribute('aria-label', '덧붙일 말 선택');
    extra.autocomplete = 'off';
    extra.maxLength = 200;
    extra.style.cssText = 'flex:1;min-width:0;min-height:44px;padding:0 12px;font-size:0.9375rem;border:1px solid var(--border);border-radius:8px;';
    extraWrap.appendChild(extra);
    choiceBar.appendChild(extraWrap);
    const done = document.createElement('button');
    done.type = 'button';
    done.className = 'done';
    done.textContent = '선택 완료';
    done.style.cssText = 'min-height:44px;border:1px solid var(--border);background:var(--accent-dark);color:#fff;border-radius:999px;padding:0 16px;font-size:0.9375rem;cursor:pointer;white-space:nowrap;';
    const submitMulti = () => {
      const note = extra.value.trim();
      const base = picked.size ? [...picked].join(', ') : '';
      let msg = '없음';
      if (base && note) msg = base + ' — ' + note;
      else if (base) msg = base;
      else if (note) msg = note;
      choiceBar.classList.remove('show'); sendRoomMessage(msg);
    };
    done.onclick = submitMulti;
    extra.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMulti(); });
    extraWrap.appendChild(done);
  } else {
    const direct = document.createElement('button');
    direct.type = 'button';
    direct.textContent = '직접 적기';
    direct.setAttribute('aria-label', '직접 적기');
    direct.onclick = () => {
      const inp = document.getElementById('input');
      if (inp) inp.focus();
    };
    choicesEl.appendChild(direct);
  }
  choiceBar.classList.add('show');
}

function updateActionBars(state) {
  voteBar.classList.toggle('show', state === 'AWAIT_APPROVAL');
  proceedBar.classList.toggle('show', state === 'QUOTED');
}

// 4초 간격 setInterval 폴링과, 메시지 전송 직후 수동 호출(sendRoomMessage → pollMessages)이
// 동시에 겹치면 둘 다 같은 lastSeq 값으로 조회를 시작해 같은 메시지를 중복 렌더링하는
// 경쟁 상태(race condition)가 생긴다 — 실측 재현됨("자신이 보낸 메시지가 자신에게 중복").
// 진행 중인 호출이 있으면 새 호출은 건너뛰어(no-op) 한 번에 하나만 실행되게 한다.
let pollInFlight = false;
async function pollMessages() {
  if (!roomId || pollInFlight) return;
  pollInFlight = true;
  try {
    const res = await fetch(`/room/${roomId}/messages?since=${lastSeq}`, { headers: { 'X-Member-Id': memberId } });
    if (!res.ok) return;
    const data = await res.json();
    for (const m of data.messages) {
      addMessage(m);
      if (m.kind === 'ai_reply' && findDesignId(m.text)) hasDesign = true;
    }
    if (data.messages.length) lastSeq += data.messages.length;
    updateStatus(data.ai_status);
    updateActionBars(data.state);
    renderChoices(data.question || null);
    if (Array.isArray(data.members)) roomMembers = data.members;
    if (data.me) roomMe = data.me;
    if (data.design_url) hasDesign = true;
    memberCountEl.textContent = roomMembers.length ? `${roomMembers.length}명 참여 중` : '';
    memberCountEl.setAttribute('aria-label', roomMembers.length ? `참여자 목록 열기, ${roomMembers.length}명 참여 중` : '참여자 목록 열기');
    renderMembers();
    updateShareUI();
    updateOwnerTools();
    // 초대 목록·카톡 상태는 폴링마다 부르지 않고 방장 확인 뒤 한 번만 조회한다.
    if (isOwner() && !invitesUnsupported && !invitesLoaded) {
      invitesLoaded = true;
      refreshInvites();
    }
    if (isOwner() && !notifyUnsupported && !notifyChecked) {
      notifyChecked = true;
      checkNotify();
    }
  } finally {
    pollInFlight = false;
  }
}

async function sendRoomMessage(text) {
  // 첫 입장 메시지에만 주소창 invite 값을 함께 보낸다 (계약 §3).
  const body = { member_id: memberId, nickname, message: text };
  if (!inviteAttached && inviteToken) body.invite = inviteToken;
  const res = await fetch(`/room/${roomId}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
    body: JSON.stringify(body),
  });
  inviteAttached = true;
  // 입장·전송 거절은 쉬운 말로 안내한다 (계약 §3).
  if (res.status === 403 || res.status === 423) {
    let detail = '';
    try { detail = (await res.clone().json()).detail || ''; } catch (e) { /* 본문이 없어도 기본 안내로 */ }
    let msg;
    if (res.status === 423 || detail === 'room closed') {
      msg = '방이 닫혔어요. 방장이 메시지를 보내면 다시 열려요.';
    } else if (detail === 'invite required') {
      msg = '초대 링크가 필요해요. 방장에게 초대 링크를 받아 주세요.';
    } else if (detail === 'invite invalid') {
      msg = '초대 링크가 만료됐거나 폐기됐어요. 방장에게 새 링크를 요청해 주세요.';
    } else {
      msg = '방이 꽉 찼어요(최대 10명). 방장에게 문의해 주세요.';
    }
    let note = document.getElementById('roomNotice');
    if (!note) {
      note = document.createElement('p');
      note.id = 'roomNotice';
      note.setAttribute('role', 'status');
      note.style.cssText = 'margin:6px 16px;font-size:0.8125rem;color:var(--text-muted);';
      document.getElementById('row').after(note);
    }
    note.textContent = msg;
    return null;
  }
  await pollMessages();
  return res.ok ? res.json() : null;
}

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendRoomMessage(text);
}

function vote(choice) { sendRoomMessage(choice); }
function proceed(choice) { sendRoomMessage(choice); }

function shareInviteUrl(absUrl) {
  if (!window.Kakao || !Kakao.isInitialized()) {
    // 초대 박스가 보이면 그 안 안내에, 아니면 입력창 아래 안내에 남긴다.
    const box = document.getElementById('inviteBox');
    const inline = document.getElementById('inviteMsg');
    if (inline && box && !box.hidden) {
      inline.textContent = '카카오 SDK 로딩에 실패했어요. 링크를 복사해 공유해 주세요.';
      return;
    }
    let note = document.getElementById('roomNotice');
    if (!note) {
      note = document.createElement('p');
      note.id = 'roomNotice';
      note.setAttribute('role', 'status');
      note.style.cssText = 'margin:6px 16px;font-size:0.8125rem;color:var(--text-muted);';
      document.getElementById('row').after(note);
    }
    note.textContent = '카카오 SDK 로딩에 실패했어요. 방 주소를 복사해 공유해 주세요.';
    return;
  }
  Kakao.Share.sendDefault({
    objectType: 'feed',
    content: {
      title: 'agt001 요구사항 도출방 초대',
      description: '함께 요구사항을 정리해봐요! AI가 견적까지 도와드려요.',
      imageUrl: 'https://placehold.co/600x400?text=agt001',
      link: { mobileWebUrl: absUrl, webUrl: absUrl },
    },
    buttons: [{ title: '방 입장하기', link: { mobileWebUrl: absUrl, webUrl: absUrl } }],
  });
}

async function shareInvite() {
  // 방장은 방 주소 대신 초대 링크를 새로 발급해 공유한다 (계약 §3). 없으면(404) 예전처럼 방 주소 공유.
  if (isOwner() && !invitesUnsupported) {
    try {
      const res = await fetch(`/room/${roomId}/invites`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
        body: JSON.stringify({ days: 7 }),
      });
      if (res.status === 404) { invitesUnsupported = true; updateShareUI(); }
      else if (res.ok) {
        const data = await res.json();
        const absUrl = new URL(data.url, location.href).href;
        refreshInvites();
        shareInviteUrl(absUrl);
        return;
      }
    } catch (e) { /* 네트워크 실패면 아래 예전 방식으로 */ }
  }
  const url = new URL(location.href);
  url.search = `?room=${roomId}`;
  shareInviteUrl(url.href);
}

// 내가 방장인지 (계약 §1 me. 서버가 아직 안 주면 방장 기능을 숨긴다).
function isOwner() {
  return !!(roomMe && roomMe.is_owner);
}

// 참여자 목록 그리기. 서버·사용자 글은 textContent로만 넣는다.
function renderMembers() {
  const list = document.getElementById('memberList');
  if (!list) return;
  list.replaceChildren();
  const title = document.getElementById('memberPanelTitle');
  if (title) title.textContent = roomMembers.length ? `참여자 ${roomMembers.length}명` : '참여자';
  for (let i = 0; i < roomMembers.length; i++) {
    const m = roomMembers[i];
    const li = document.createElement('li');
    const nick = document.createElement('span');
    nick.className = 'nick';
    nick.textContent = m.nickname || '익명';
    li.appendChild(nick);
    // 서버가 is_owner를 아직 안 주면 가장 먼저 들어온 사람이 방장이다.
    const owner = typeof m.is_owner === 'boolean' ? m.is_owner : i === 0;
    if (owner) {
      const badge = document.createElement('span');
      badge.className = 'owner-badge';
      badge.textContent = '방장';
      badge.style.cssText = 'font-size:0.6875rem;background:var(--accent-dark);color:#fff;padding:2px 8px;border-radius:999px;';
      li.appendChild(badge);
    }
    // 내가 방장이면 다른 참여자에게 방장을 넘길 수 있다.
    if (isOwner() && !ownerApiUnsupported && m.member_handle && (!roomMe || m.member_handle !== roomMe.member_handle)) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'transferBtn';
      btn.textContent = '방장 넘기기';
      btn.setAttribute('aria-label', (m.nickname || '익명') + '에게 방장 넘기기');
      btn.onclick = () => openOwnerDialog(m);
      li.appendChild(btn);
    }
    list.appendChild(li);
  }
  const leaveBtn = document.getElementById('leaveBtn');
  if (leaveBtn) leaveBtn.hidden = leaveUnsupported;
}

function openMemberPanel() {
  const wrap = document.getElementById('memberPanelWrap');
  if (!wrap) return;
  renderMembers();
  wrap.hidden = false;
  memberCountEl.setAttribute('aria-expanded', 'true');
  const closeBtn = document.getElementById('memberPanelClose');
  if (closeBtn) closeBtn.focus();
}

function closeMemberPanel() {
  const wrap = document.getElementById('memberPanelWrap');
  if (!wrap) return;
  wrap.hidden = true;
  memberCountEl.setAttribute('aria-expanded', 'false');
  memberCountEl.focus();
}

// 화면 안 대화상자로 방장 넘기기 확인 (window.confirm 대신).
let ownerTransferTarget = null;
let ownerTransferReturnFocus = null;
function openOwnerDialog(m) {
  ownerTransferTarget = m;
  ownerTransferReturnFocus = document.activeElement;
  const wrap = document.getElementById('ownerDialogWrap');
  const text = document.getElementById('ownerDialogText');
  if (!wrap || !text) return;
  text.textContent = (m.nickname || '익명') + '님에게 방장을 넘길까요? 넘기면 초대·폐기는 새 방장이 맡아요.';
  wrap.hidden = false;
  document.getElementById('ownerConfirmBtn').focus();
}

function closeOwnerDialog() {
  const wrap = document.getElementById('ownerDialogWrap');
  if (wrap) wrap.hidden = true;
  ownerTransferTarget = null;
  if (ownerTransferReturnFocus && ownerTransferReturnFocus.focus) ownerTransferReturnFocus.focus();
}

async function confirmOwnerTransfer() {
  if (!ownerTransferTarget) { closeOwnerDialog(); return; }
  try {
    const res = await fetch(`/room/${roomId}/owner`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
      body: JSON.stringify({ to: ownerTransferTarget.member_handle }),
    });
    if (res.status === 404) {
      ownerApiUnsupported = true;
      closeOwnerDialog();
      renderMembers();
      return;
    }
    if (res.status === 403) {
      const text = document.getElementById('ownerDialogText');
      if (text) text.textContent = '방장만 넘길 수 있어요.';
      return;
    }
    if (!res.ok) {
      const text = document.getElementById('ownerDialogText');
      if (text) text.textContent = '지금은 넘길 수 없어요. 잠시 뒤에 다시 시도해 주세요.';
      return;
    }
    closeOwnerDialog();
    await pollMessages();
  } catch (e) {
    const text = document.getElementById('ownerDialogText');
    if (text) text.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.';
  }
}

async function leaveRoom() {
  try {
    const res = await fetch(`/room/${roomId}/leave`, {
      method: 'POST',
      headers: { 'X-Member-Id': memberId },
    });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 버튼을 숨긴다.
      leaveUnsupported = true;
      renderMembers();
      return;
    }
    if (!res.ok) return;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    const wrap = document.getElementById('memberPanelWrap');
    if (wrap) wrap.hidden = true;
    let note = document.getElementById('roomNotice');
    if (!note) {
      note = document.createElement('p');
      note.id = 'roomNotice';
      note.setAttribute('role', 'status');
      note.style.cssText = 'margin:6px 16px;font-size:0.8125rem;color:var(--text-muted);';
      document.getElementById('row').after(note);
    }
    note.textContent = '방에서 나갔어요.';
  } catch (e) { /* 네트워크 실패면 그대로 둔다 */ }
}

// 초대 패널 보이기·숨기기. 방장이 아니면 공유 버튼 대신 안내 문구를 보여준다.
// 서버가 내 정보(me)를 아직 안 주면 예전 공유 버튼 그대로 둔다.
function updateShareUI() {
  const owner = isOwner();
  const shareBtn = document.getElementById('shareBtn');
  const notice = document.getElementById('inviteNotice');
  const box = document.getElementById('inviteBox');
  if (!shareBtn || !notice || !box) return;
  if (!roomMe) {
    shareBtn.hidden = false;
    notice.hidden = true;
    box.hidden = true;
    return;
  }
  if (owner && !invitesUnsupported) {
    shareBtn.hidden = false;
    notice.hidden = true;
    box.hidden = false;
  } else if (owner) {
    shareBtn.hidden = false;
    notice.hidden = true;
    box.hidden = true;
  } else {
    shareBtn.hidden = true;
    notice.hidden = false;
    box.hidden = true;
  }
}

function inviteExpiryText(inv) {
  if (!inv.expires_at) return '무기한';
  const d = new Date(inv.expires_at);
  if (isNaN(d.getTime())) return '기간 있음';
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일까지';
}

async function refreshInvites() {
  if (!isOwner() || invitesUnsupported) return;
  const list = document.getElementById('inviteList');
  if (!list) return;
  try {
    const res = await fetch(`/room/${roomId}/invites`, { headers: { 'X-Member-Id': memberId } });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 숨긴다.
      invitesUnsupported = true;
      updateShareUI();
      return;
    }
    if (!res.ok) return;
    const data = await res.json();
    list.replaceChildren();
    for (const inv of data.invites || []) {
      if (inv.revoked) continue;
      const li = document.createElement('li');
      const info = document.createElement('span');
      info.className = 'info';
      const uses = typeof inv.uses === 'number' ? ' · ' + inv.uses + '명 입장' : '';
      info.textContent = inviteExpiryText(inv) + uses;
      li.appendChild(info);
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.textContent = '복사';
      copyBtn.setAttribute('aria-label', '초대 링크 복사');
      copyBtn.onclick = () => copyInviteLink(inv);
      li.appendChild(copyBtn);
      const shareBtn = document.createElement('button');
      shareBtn.type = 'button';
      shareBtn.textContent = '카톡 공유';
      shareBtn.setAttribute('aria-label', '초대 링크 카톡 공유');
      shareBtn.onclick = () => shareInviteLink(inv);
      li.appendChild(shareBtn);
      const revokeBtn = document.createElement('button');
      revokeBtn.type = 'button';
      revokeBtn.textContent = '폐기';
      revokeBtn.setAttribute('aria-label', '초대 링크 폐기');
      revokeBtn.onclick = () => revokeInvite(inv.invite_id);
      li.appendChild(revokeBtn);
      list.appendChild(li);
    }
  } catch (e) { /* 네트워크 실패면 그대로 둔다 */ }
}

// 목록에는 토큰 원문이 없어 방금 발급한 링크만 바로 공유·복사한다.
let lastIssuedInviteUrl = '';
async function createInvite() {
  const msg = document.getElementById('inviteMsg');
  const daysEl = document.getElementById('inviteDays');
  const days = daysEl ? Number(daysEl.value) : 7;
  try {
    const res = await fetch(`/room/${roomId}/invites`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
      body: JSON.stringify({ days }),
    });
    if (res.status === 404) {
      invitesUnsupported = true;
      updateShareUI();
      return;
    }
    if (!res.ok) {
      if (msg) msg.textContent = '지금은 초대 링크를 만들 수 없어요. 잠시 뒤에 다시 시도해 주세요.';
      return;
    }
    const data = await res.json();
    lastIssuedInviteUrl = new URL(data.url, location.href).href;
    if (msg) msg.textContent = '초대 링크를 만들었어요. 복사하거나 카톡으로 공유해 주세요.';
    try {
      await navigator.clipboard.writeText(lastIssuedInviteUrl);
      if (msg) msg.textContent = '초대 링크를 복사했어요. 카톡으로 공유해 주세요.';
    } catch (e) { /* 클립보드 실패면 안내만 둔다 */ }
    shareInviteUrl(lastIssuedInviteUrl);
    refreshInvites();
  } catch (e) {
    if (msg) msg.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.';
  }
}

async function copyInviteLink(inv) {
  const msg = document.getElementById('inviteMsg');
  // 목록 조회에는 주소가 없으므로 방금 발급한 링크만 복사한다.
  if (!lastIssuedInviteUrl) {
    if (msg) msg.textContent = '방금 발급한 링크만 복사할 수 있어요. 초대하기를 눌러 새로 발급해 주세요.';
    return;
  }
  try {
    await navigator.clipboard.writeText(lastIssuedInviteUrl);
    if (msg) msg.textContent = '초대 링크를 복사했어요.';
  } catch (e) {
    if (msg) msg.textContent = '복사에 실패했어요. 초대하기를 눌러 새 링크로 공유해 주세요.';
  }
}

function shareInviteLink(inv) {
  if (!lastIssuedInviteUrl) {
    const msg = document.getElementById('inviteMsg');
    if (msg) msg.textContent = '방금 발급한 링크만 공유할 수 있어요. 초대하기를 눌러 새로 발급해 주세요.';
    return;
  }
  shareInviteUrl(lastIssuedInviteUrl);
}

async function revokeInvite(inviteId) {
  const msg = document.getElementById('inviteMsg');
  try {
    const res = await fetch(`/room/${roomId}/invites/${inviteId}`, {
      method: 'DELETE',
      headers: { 'X-Member-Id': memberId },
    });
    if (res.status === 404) {
      invitesUnsupported = true;
      updateShareUI();
      return;
    }
    if (!res.ok) {
      if (msg) msg.textContent = '지금은 폐기할 수 없어요. 잠시 뒤에 다시 시도해 주세요.';
      return;
    }
    if (msg) msg.textContent = '초대 링크를 폐기했어요.';
    refreshInvites();
  } catch (e) {
    if (msg) msg.textContent = '인터넷 연결을 확인하고 다시 시도해 주세요.';
  }
}

// 사진 올리기 (계약 §4). 성공하면 폴링으로 photo 메시지가 보인다.
const PHOTO_MAX_BYTES = 10 * 1024 * 1024;
function setPhotoStatus(text) {
  const el = document.getElementById('photoStatus');
  if (!el) return;
  el.textContent = text || '';
  el.classList.toggle('show', !!text);
}

async function uploadPhoto(file) {
  const btn = document.getElementById('photoBtn');
  if (!file) return;
  if (file.size > PHOTO_MAX_BYTES) {
    setPhotoStatus('사진이 너무 커요. 10MB 이하로 올려 주세요.');
    return;
  }
  setPhotoStatus('사진을 올리는 중…');
  if (btn) btn.disabled = true;
  try {
    const form = new FormData();
    form.append('file', file);
    const res = await fetch(`/room/${roomId}/photos`, {
      method: 'POST',
      headers: { 'X-Member-Id': memberId },
      body: form,
    });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 버튼을 숨긴다.
      if (btn) btn.style.display = 'none';
      setPhotoStatus('');
      return;
    }
    if (res.status === 413) {
      setPhotoStatus('사진이 너무 커요. 10MB 이하로 올려 주세요.');
      return;
    }
    if (!res.ok) {
      setPhotoStatus('지금은 사진을 올릴 수 없어요. 잠시 뒤에 다시 시도해 주세요.');
      return;
    }
    setPhotoStatus('');
    await pollMessages();
  } catch (e) {
    setPhotoStatus('인터넷 연결을 확인하고 다시 시도해 주세요.');
  } finally {
    if (btn) btn.disabled = false;
    const input = document.getElementById('photoInput');
    if (input) input.value = '';
  }
}

// 방장 도구: 카톡 알림 상태·직접 고치기 링크 (계약 §5·§6). 방장에게만 보인다.
function updateOwnerTools() {
  const tools = document.getElementById('ownerTools');
  const talkBtn = document.getElementById('talkNotifyBtn');
  const editor = document.getElementById('editorLink');
  if (!tools || !talkBtn || !editor) return;
  if (!isOwner()) {
    tools.hidden = true;
    talkBtn.hidden = true;
    editor.hidden = true;
    return;
  }
  tools.hidden = false;
  if (!notifyUnsupported) talkBtn.hidden = false;
  if (hasDesign) {
    editor.hidden = false;
    editor.href = '/editor?room=' + encodeURIComponent(roomId);
  } else {
    editor.hidden = true;
  }
}

async function checkNotify() {
  const talkBtn = document.getElementById('talkNotifyBtn');
  if (!talkBtn) return;
  try {
    const res = await fetch(`/api/rooms/${roomId}/notify`, { headers: { 'X-Member-Id': memberId } });
    if (res.status === 404) {
      // 서버가 아직 없으면 조용히 숨긴다.
      notifyUnsupported = true;
      talkBtn.hidden = true;
      updateOwnerTools();
      return;
    }
    if (!res.ok) return;
    const data = await res.json();
    const on = !!(data && data.kakao && data.kakao.owner_linked);
    talkBtn.textContent = on ? '카톡 알림 켜짐' : '문의를 카톡으로 받기';
    talkBtn.disabled = on;
  } catch (e) { /* 네트워크 실패면 그대로 둔다 */ }
}

function startTalkNotify() {
  const next = '/room.html?room=' + encodeURIComponent(roomId);
  location.href = '/auth/kakao/start?talk=1&next=' + encodeURIComponent(next);
}

// 카카오 로그인에서 돌아왔을 때 방을 계정에 한 번만 옮긴다 (계약 §6).
async function claimRoomOnce() {
  if (claimTried || !roomId || !memberId) return;
  claimTried = true;
  let key = '';
  try { key = 'agt001_claimed_' + roomId; } catch (e) { return; }
  try {
    if (sessionStorage.getItem(key)) return;
  } catch (e) { /* 저장소를 못 쓰면 한 번만 시도하고 끝낸다 */ }
  let me = null;
  try {
    const res = await fetch('/api/me', { credentials: 'same-origin' });
    if (res.status === 404) return;
    if (!res.ok) return;
    me = await res.json();
  } catch (e) { return; }
  if (!me || !me.user) return;
  try {
    await fetch('/api/me/claim', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Member-Id': memberId },
      body: JSON.stringify({ room_ids: [roomId] }),
    });
  } catch (e) { /* 실패해도 방 사용은 계속된다 */ }
  try { sessionStorage.setItem(key, '1'); } catch (e) { /* 무시 */ }
}

async function ensureRoom() {
  if (roomId) return;
  const res = await fetch('/room', { method: 'POST' });
  const data = await res.json();
  roomId = data.room_id;
  const url = new URL(location.href);
  url.searchParams.set('room', roomId);
  history.replaceState(null, '', url);
}

function joinRoom() {
  const input = document.getElementById('nicknameInput');
  const value = input.value.trim();
  if (!value) { input.focus(); return; }
  nickname = value;
  safeSet('agt001_nickname', nickname);
  document.getElementById('nicknameOverlay').remove();
  startRoom();
}

// 이 기기에서 들어간 방을 기억한다("내 프로젝트" 화면이 읽는다, /projects). 최근 50개까지.
function rememberRoom(id) {
  try {
    const list = JSON.parse(localStorage.getItem('agt001_rooms') || '[]').filter((r) => r !== id);
    list.unshift(id);
    localStorage.setItem('agt001_rooms', JSON.stringify(list.slice(0, 50)));
  } catch (e) { /* 저장소를 못 쓰면 목록만 비어 있다 */ }
}

async function startRoom() {
  await ensureRoom();
  if (!memberId) {
    memberId = makeMemberId();
    safeSet('agt001_member_id', memberId);
  }
  // 온보딩 안내: 서버에 남기지 않는 프론트 1회성 표시. 정말 새 방일 때만 보여준다.
  // 참여자가 아니면 기록을 조회할 수 없으므로(ROOM_POLICY.md R-0), 새 방인지는
  // 입장 응답의 fresh(입장 전 메시지가 하나도 없었는지)로 판단한다.
  rememberRoom(roomId);
  const joined = await sendRoomMessage('');
  claimRoomOnce();
  if (pending) {
    // 랜딩에서 적은 내용을 첫 메시지로 보낸다. 사용자가 이미 설명했으므로 안내 메시지는 생략한다.
    await sendRoomMessage(pending.text);
  } else if (joined && joined.fresh) {
    showOnboarding();
  }
  pollTimer = setInterval(pollMessages, 4000);
}

// 새 방 첫 입장 시 1회만 보여주는 온보딩 안내.
// kind=ai_reply로 렌더링해서 AI가 직접 소개하는 느낌으로 보여준다.
// 서버 messages 배열에는 저장하지 않는다(프론트 표시 전용이므로 seq/lastSeq와
// 무관하고, 이후 폴링·투표·진행 등 기존 기능에 영향을 주지 않는다).
const ONBOARDING_TEXT =
  '안녕하세요! 저는 웹사이트 제작을 돕는 AI 어시스턴트입니다. 🤖\n\n' +
  '원하는 걸 편하게 말씀해 보세요. 함께 요구사항을 정리하고, 견적을 내고, ' +
  '실제로 열리는 시안 페이지와 코드까지 만들어 드립니다.\n\n' +
  '예를 들면 이런 것들이에요:\n' +
  '• 카페/스터디카페 예약 페이지 (날짜·시간 예약, 메뉴 소개)\n' +
  '• 회사·가게 소개 랜딩페이지\n' +
  '• 상품 소개 + 문의 폼 페이지\n\n' +
  '먼저 만들고 싶은 것을 한 문장으로 적어주세요. (예: "카페 예약 웹사이트 만들고 싶어요")';

function showOnboarding() {
  addMessage({ kind: 'ai_reply', nickname: 'AI 어시스턴트', text: ONBOARDING_TEXT });
}

document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// 참여자 패널·초대·사진·방장 도구 연결
memberCountEl.addEventListener('click', () => {
  const wrap = document.getElementById('memberPanelWrap');
  if (wrap && !wrap.hidden) closeMemberPanel();
  else openMemberPanel();
});
document.getElementById('memberPanelClose').addEventListener('click', closeMemberPanel);
document.getElementById('memberPanelWrap').addEventListener('click', (e) => {
  if (e.target && e.target.id === 'memberPanelWrap') closeMemberPanel();
});
document.getElementById('leaveBtn').addEventListener('click', leaveRoom);
document.getElementById('ownerConfirmBtn').addEventListener('click', confirmOwnerTransfer);
document.getElementById('ownerCancelBtn').addEventListener('click', closeOwnerDialog);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const ownerWrap = document.getElementById('ownerDialogWrap');
  if (ownerWrap && !ownerWrap.hidden) { closeOwnerDialog(); return; }
  const memberWrap = document.getElementById('memberPanelWrap');
  if (memberWrap && !memberWrap.hidden) closeMemberPanel();
});
document.getElementById('inviteCreateBtn').addEventListener('click', createInvite);
document.getElementById('photoBtn').addEventListener('click', () => {
  document.getElementById('photoInput').click();
});
document.getElementById('photoInput').addEventListener('change', (e) => {
  const f = e.target && e.target.files && e.target.files[0];
  if (f) uploadPhoto(f);
});
document.getElementById('talkNotifyBtn').addEventListener('click', startTalkNotify);

// 랜딩(frontend/src/api.ts)에서 넘어온 첫 메시지. 이 방의 것일 때만 한 번 쓰고 지운다.
let pending = null;
try {
  const raw = sessionStorage.getItem('agt001_pending_message');
  if (raw) {
    const p = JSON.parse(raw);
    if (p && p.roomId === roomId && typeof p.text === 'string') pending = p;
    sessionStorage.removeItem('agt001_pending_message');
  }
} catch (e) { /* 저장소를 못 쓰면 평소처럼 시작 */ }
// 랜딩에서 바로 온 사람은 닉네임 입력 없이 시작한다(저장하지 않아 다른 방에는 영향 없음).
if (!nickname && pending) nickname = '사장님';

if (nickname) {
  document.getElementById('nicknameOverlay').remove();
  startRoom();
}
// nickname 없을 때는 #nicknameJoinBtn의 inline onclick="joinRoom()"이 처리한다 (중복 리스너 금지).
</script>
