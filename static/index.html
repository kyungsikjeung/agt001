<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>agt001 챗봇 (뼈대)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; margin-bottom: 12px; }
  .msg { margin: 8px 0; white-space: pre-wrap; line-height: 1.4; }
  .user { text-align: right; color: #0a5; }
  .bot { text-align: left; color: #333; }
  #row { display: flex; gap: 8px; }
  #input { flex: 1; padding: 8px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
  <h2>agt001 챗봇 (뼈대 단계)</h2>
  <div id="log"></div>
  <div id="row">
    <input id="input" placeholder="메시지를 입력하세요..." autocomplete="off">
    <button onclick="send()">보내기</button>
  </div>

<script>
let sessionId = null;
const log = document.getElementById('log');
const input = document.getElementById('input');

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const text = input.value;
  input.value = '';
  if (text) addMsg(text, 'user');

  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });
  const data = await res.json();
  sessionId = data.session_id;
  addMsg(data.reply, 'bot');
}

input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
// 첫 진입 시 빈 메시지로 인사 받기
send();
</script>
</body>
</html>
