<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agt001 챗봇 (뼈대)</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 640px; width: 100%; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; margin-bottom: 12px; }
  .msg { margin: 8px 0; white-space: pre-wrap; line-height: 1.4; }
  .user { text-align: right; color: #0a5; }
  .bot { text-align: left; color: #333; }
  #row { display: flex; gap: 8px; }
  #input { flex: 1; min-width: 0; padding: 8px; font-size: 1rem; }
  button { padding: 8px 16px; font-size: 1rem; white-space: nowrap; }
  @media (max-width: 768px) {
    body { margin: 24px auto; }
    #log { height: 55vh; }
  }
  @media (max-width: 480px) {
    body { margin: 16px auto; padding: 0 12px; }
    h2 { font-size: 1.125rem; }
    #log { height: 60vh; padding: 10px; }
    .msg { font-size: 0.9375rem; }
    #input { padding: 10px 8px; }
    button { padding: 10px 12px; }
  }
</style>
</head>
<body>
  <h2>agt001 챗봇 (뼈대 단계)</h2>
  <div id="log"></div>
  <div id="row">
    <input id="input" placeholder="메시지를 입력하세요..." autocomplete="off">
    <button onclick="send()">보내기</button>
  </div>

<script>
// ⑦카카오링크(팀B): JS 키는 클라이언트에 노출되는 공개 키라 그대로 하드코딩한다 (비밀키 아님).
const KAKAO_JS_KEY = 'db5e5247ff48a792df0cc393b4453c6d';
if (window.Kakao && !Kakao.isInitialized()) {
  Kakao.init(KAKAO_JS_KEY);
}

let sessionId = null;
const log = document.getElementById('log');
const input = document.getElementById('input');

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function addKakaoShareButton(url, opts) {
  const { label = '카카오톡으로 공유하기', title = 'agt001 프로젝트 결과', description = '요청하신 프로젝트 결과물이 준비됐습니다.', buttonLabel = '결과 보기', imageUrl } = opts || {};
  const absUrl = new URL(url, window.location.href).href;
  const absImageUrl = new URL(imageUrl || 'https://placehold.co/600x400?text=agt001', window.location.href).href;
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.style.margin = '8px 0';
  btn.onclick = () => {
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title,
        description,
        imageUrl: absImageUrl,
        link: { mobileWebUrl: absUrl, webUrl: absUrl },
      },
      buttons: [{ title: buttonLabel, link: { mobileWebUrl: absUrl, webUrl: absUrl } }],
    });
  };
  log.appendChild(btn);
  log.scrollTop = log.scrollHeight;
}

let pollTimer = null;

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

// ⑧팀C 코드생성(Hermes)은 백그라운드에서 돌기 때문에, GENERATING 상태인 동안
// 화면에 메시지를 새로 찍지 않고 조용히 폴링만 하다가 상태가 바뀌면 결과를 보여준다.
function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: '' + Math.random() }),
    });
    const data = await res.json();
    if (data.design_url) {
      addKakaoShareButton(data.design_url, { label: '시안 카카오톡으로 공유하기', title: 'UI 시안이 준비됐어요', description: '마음에 드는 디자인을 확인해보세요.', buttonLabel: '시안 보기', imageUrl: data.design_preview_url });
    }
    if (data.state !== 'GENERATING') {
      stopPolling();
      addMsg(data.reply, 'bot');
      if (data.state === 'DONE' && data.deploy_url) {
        addKakaoShareButton(data.deploy_url);
      }
    }
  }, 4000);
}

async function send() {
  const text = input.value;
  input.value = '';
  if (text) addMsg(text, 'user');

  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });
  const data = await res.json();
  sessionId = data.session_id;
  addMsg(data.reply, 'bot');
  if (data.design_url) {
    addKakaoShareButton(data.design_url, { label: '시안 카카오톡으로 공유하기', title: 'UI 시안이 준비됐어요', description: '마음에 드는 디자인을 확인해보세요.', buttonLabel: '시안 보기', imageUrl: data.design_preview_url });
  }
  if (data.state === 'DONE' && data.deploy_url) {
    addKakaoShareButton(data.deploy_url);
  }
  if (data.state === 'GENERATING') {
    startPolling();
  }
}

input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
// 첫 진입 시 빈 메시지로 인사 받기
send();
</script>
</body>
</html>
