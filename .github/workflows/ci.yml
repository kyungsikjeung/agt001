name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agt001
          POSTGRES_PASSWORD: agt001
          POSTGRES_DB: agt001_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIM_API_KEY: ci-dummy
      PRECOMPUTE_EMBEDDINGS: "false"
      TEST_DATABASE_URL: postgresql+psycopg://agt001:agt001@localhost:55432/agt001_test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app
      - name: Unit tests
        run: pytest -q

  journeys:
    # 핵심 여정 점검 (tests/e2e/test_journeys.py): 앱을 안에서 띄워 휴대폰 크기 브라우저로 돈다.
    # 2026-10-12까지 경고만, 그 뒤 필수 (UX_GAP_PLAN Q2)
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agt001
          POSTGRES_PASSWORD: agt001
          POSTGRES_DB: agt001_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIM_API_KEY: ci-dummy
      PRECOMPUTE_EMBEDDINGS: "false"
      TEST_DATABASE_URL: postgresql+psycopg://agt001:agt001@localhost:55432/agt001_test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Journey tests
        run: pytest -q tests/e2e/test_journeys.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test
